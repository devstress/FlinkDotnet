name: Release - Minor Version

on:
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  CONFIGURATION: 'Release'
  DOCKER_IMAGE_NAME: 'devstress/flinkdotnet'

jobs:
  calculate-version:
    name: Calculate New Minor Version
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      release_branch: ${{ steps.bump.outputs.release_branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version from main branch
        id: get_version
        run: |
          # Get the default branch name
          DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD 2>/dev/null | sed 's@^refs/remotes/origin/@@' || echo "main")
          echo "Default branch: $DEFAULT_BRANCH"
          
          # Fetch the default branch to get the package version
          git fetch origin "$DEFAULT_BRANCH" 2>/dev/null || true
          
          # Get package version from the project file in the default branch
          CURRENT=$(git show "origin/$DEFAULT_BRANCH:FlinkDotNet/FlinkDotNet.DataStream/FlinkDotNet.DataStream.csproj" 2>/dev/null | grep -oP '(?<=<PackageVersion>)[^<]+' || echo "1.0.0")
          echo "Package version in $DEFAULT_BRANCH branch: $CURRENT"
          
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
      
      - name: Bump minor version and check NuGet for existing published versions
        id: bump
        run: |
          CURRENT="${{ steps.get_version.outputs.current }}"
          
          # Function to check if a version exists on NuGet.org
          check_nuget_version_exists() {
            local version=$1
            echo "Checking if version $version exists on NuGet.org..."
            
            # Query NuGet API for the package versions with timeout and error handling
            # Pattern matches version in JSON array context: "version" followed by comma, bracket, or whitespace
            NUGET_VERSIONS=$(curl -s --max-time 30 --fail "https://api.nuget.org/v3-flatcontainer/flinkdotnet/index.json" 2>/dev/null | grep -E "\"$version\"" || echo "")
            
            if [ -n "$NUGET_VERSIONS" ]; then
              echo "Version $version exists on NuGet.org"
              return 0  # Version exists
            else
              echo "Version $version does NOT exist on NuGet.org"
              return 1  # Version doesn't exist
            fi
          }
          
          # Logic based on current version from main branch
          if [ "$CURRENT" = "1.0.0" ]; then
            # Starting fresh at 1.0.0
            TARGET_VERSION="1.0.0"
            echo "Starting with version 1.0.0 from main branch"
            
            set +e  # Allow check_nuget_version_exists to return non-zero without failing
            check_nuget_version_exists "$TARGET_VERSION"
            result=$?
            set -e  # Re-enable error exit
            
            if [ $result -eq 0 ]; then
              # Version exists on NuGet - bump to next version
              echo "Version 1.0.0 is already published on NuGet, bumping to next minor version"
              FINAL_VERSION="1.1.0"
            else
              # Version doesn't exist on NuGet - use 1.0.0
              echo "Version 1.0.0 not published on NuGet, using 1.0.0"
              FINAL_VERSION="1.0.0"
            fi
          else
            # Not starting fresh - bump version first
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEW_MINOR=$((MINOR + 1))
            TARGET_VERSION="${MAJOR}.${NEW_MINOR}.0"
            echo "Bumped version from $CURRENT to $TARGET_VERSION"
            
            set +e  # Allow check_nuget_version_exists to return non-zero without failing
            check_nuget_version_exists "$TARGET_VERSION"
            result=$?
            set -e  # Re-enable error exit
            
            if [ $result -eq 0 ]; then
              # Bumped version exists on NuGet - bump again
              echo "Version $TARGET_VERSION is already published on NuGet, bumping to next minor version"
              NEW_MINOR=$((NEW_MINOR + 1))
              FINAL_VERSION="${MAJOR}.${NEW_MINOR}.0"
            else
              # Bumped version doesn't exist on NuGet - use it
              echo "Version $TARGET_VERSION not published on NuGet, using $TARGET_VERSION"
              FINAL_VERSION="$TARGET_VERSION"
            fi
          fi
          
          echo "Final version selected: $FINAL_VERSION"
          echo "new_version=$FINAL_VERSION" >> $GITHUB_OUTPUT
          echo "release_branch=release/v$FINAL_VERSION" >> $GITHUB_OUTPUT

  update-version:
    name: Update Version in Release Branch
    needs: calculate-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release branch
        run: |
          VERSION=${{ needs.calculate-version.outputs.new_version }}
          RELEASE_BRANCH="${{ needs.calculate-version.outputs.release_branch }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Delete remote branch if it exists (force delete to handle any state)
          git push origin --delete "$RELEASE_BRANCH" 2>/dev/null || echo "Remote branch didn't exist (this is OK)"
          
          # Delete local branch if it exists
          git branch -D "$RELEASE_BRANCH" 2>/dev/null || echo "Local branch didn't exist (this is OK)"
          
          # Create and checkout fresh release branch
          git checkout -b "$RELEASE_BRANCH"
          echo "Created fresh release branch: $RELEASE_BRANCH"

      - name: Update PackageVersion in .csproj files
        run: |
          VERSION=${{ needs.calculate-version.outputs.new_version }}
          echo "Updating project files to version: $VERSION"
          
          # Update FlinkDotnet (unified package)
          sed -i "s|<PackageVersion>.*</PackageVersion>|<PackageVersion>$VERSION</PackageVersion>|g" \
            FlinkDotNet/FlinkDotNet.DataStream/FlinkDotNet.DataStream.csproj
          
          echo "Updated project files:"
          grep "PackageVersion" FlinkDotNet/FlinkDotNet.DataStream/FlinkDotNet.DataStream.csproj

      - name: Commit version updates to release branch
        run: |
          VERSION=${{ needs.calculate-version.outputs.new_version }}
          RELEASE_BRANCH="${{ needs.calculate-version.outputs.release_branch }}"
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add FlinkDotNet/FlinkDotNet.DataStream/FlinkDotNet.DataStream.csproj
          
          # Only commit if there are staged changes
          if ! git diff --staged --quiet; then
            git commit -m "Bump version to $VERSION"
            git push --force origin "$RELEASE_BRANCH"
            echo "Pushed version update to $RELEASE_BRANCH"
          else
            echo "No version changes to commit (already at version $VERSION)"
            git push --force origin "$RELEASE_BRANCH"
          fi

  build-and-package:
    name: Build and Package FlinkDotNet
    needs: [calculate-version, update-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.calculate-version.outputs.release_branch }}

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: '3.9.6'

      - name: Restore dependencies
        run: dotnet restore FlinkDotNet/FlinkDotNet.sln

      - name: Build solution
        run: dotnet build FlinkDotNet/FlinkDotNet.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run unit tests
        run: dotnet test FlinkDotNet/FlinkDotNet.sln --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

      - name: Create NuGet packages
        run: |
          VERSION=${{ needs.calculate-version.outputs.new_version }}
          echo "Creating packages with version: $VERSION"
          
          # Package FlinkDotnet (unified package)
          dotnet pack FlinkDotNet/FlinkDotNet.DataStream/FlinkDotNet.DataStream.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --output ./packages \
            -p:PackageVersion=$VERSION

      - name: List generated packages
        run: |
          echo "Generated NuGet packages:"
          ls -la ./packages/*.nupkg

      - name: Upload NuGet packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./packages/*.nupkg
          retention-days: 30

  build-docker-image:
    name: Build Docker Image for JobGateway
    needs: [calculate-version, update-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.calculate-version.outputs.release_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          VERSION=${{ needs.calculate-version.outputs.new_version }}
          docker build \
            -f FlinkDotNet/FlinkDotNet.JobGateway/Dockerfile \
            -t ${{ env.DOCKER_IMAGE_NAME }}:$VERSION \
            -t ${{ env.DOCKER_IMAGE_NAME }}:latest \
            .
          
          # Save image to tarball for release
          docker save ${{ env.DOCKER_IMAGE_NAME }}:$VERSION -o jobgateway-$VERSION.tar
          gzip jobgateway-$VERSION.tar

      - name: Upload Docker image as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: jobgateway-*.tar.gz
          retention-days: 30

  build-standalone-executables:
    name: Build Standalone Executables for JobGateway
    needs: [calculate-version, update-version]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.calculate-version.outputs.release_branch }}

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: '3.9.6'

      - name: Build Windows x64 Standalone
        run: |
          VERSION=${{ needs.calculate-version.outputs.new_version }}
          echo "Building Windows x64 standalone executable for version $VERSION"
          
          dotnet publish FlinkDotNet/FlinkDotNet.JobGateway/FlinkDotNet.JobGateway.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --runtime win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            --output ./publish/win-x64
          
          # Copy startup scripts and README
          cp FlinkDotNet/FlinkDotNet.JobGateway/start-gateway.bat ./publish/win-x64/
          cp FlinkDotNet/FlinkDotNet.JobGateway/STANDALONE-README.md ./publish/win-x64/README.md
          cp FlinkDotNet/FlinkDotNet.JobGateway/appsettings.json ./publish/win-x64/appsettings.json
          
          # Create ZIP archive
          cd ./publish/win-x64
          zip -r ../../jobgateway-win-x64-$VERSION.zip .
          cd ../..
          
          echo "Windows x64 package created: jobgateway-win-x64-$VERSION.zip"

      - name: Build Linux x64 Standalone
        run: |
          VERSION=${{ needs.calculate-version.outputs.new_version }}
          echo "Building Linux x64 standalone executable for version $VERSION"
          
          dotnet publish FlinkDotNet/FlinkDotNet.JobGateway/FlinkDotNet.JobGateway.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --runtime linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            --output ./publish/linux-x64
          
          # Copy startup scripts and README
          cp FlinkDotNet/FlinkDotNet.JobGateway/start-gateway.sh ./publish/linux-x64/
          chmod +x ./publish/linux-x64/start-gateway.sh
          cp FlinkDotNet/FlinkDotNet.JobGateway/STANDALONE-README.md ./publish/linux-x64/README.md
          cp FlinkDotNet/FlinkDotNet.JobGateway/appsettings.json ./publish/linux-x64/appsettings.json
          
          # Create tar.gz archive
          cd ./publish/linux-x64
          tar -czf ../../jobgateway-linux-x64-$VERSION.tar.gz .
          cd ../..
          
          echo "Linux x64 package created: jobgateway-linux-x64-$VERSION.tar.gz"

      - name: List generated packages
        run: |
          echo "Generated standalone executable packages:"
          ls -lh jobgateway-*.zip jobgateway-*.tar.gz

      - name: Upload standalone executables as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: standalone-executables
          path: |
            jobgateway-win-x64-*.zip
            jobgateway-linux-x64-*.tar.gz
          retention-days: 30

  test-release-packages:
    name: Test Release Packages (Pre-Release Validation)
    needs: [calculate-version, update-version, build-and-package, build-docker-image, build-standalone-executables]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.calculate-version.outputs.release_branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: '3.9.6'

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install .NET Aspire workload
        run: |
          echo "📦 Installing .NET Aspire workload..."
          dotnet workload install aspire
          echo "✅ Aspire workload installed successfully"

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./docker

      - name: Add local NuGet source
        run: |
          dotnet nuget add source $(pwd)/packages --name LocalFeed
          echo "Added local NuGet source"

      - name: Load Docker image
        run: |
          VERSION=${{ needs.calculate-version.outputs.new_version }}
          gunzip -c ./docker/jobgateway-$VERSION.tar.gz | docker load
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:$VERSION ${{ env.DOCKER_IMAGE_NAME }}:latest
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:$VERSION flinkdotnet-gateway:local
          echo "Loaded Docker image for version $VERSION and tagged as latest and flinkdotnet-gateway:local"

      - name: Configure system for optimal performance
        run: |
          echo "=== Configuring system for optimal performance ==="
          sudo sysctl -w vm.max_map_count=262144
          sudo bash -c 'echo "* soft nofile 65536" >> /etc/security/limits.conf'
          sudo bash -c 'echo "* hard nofile 65536" >> /etc/security/limits.conf'
          echo "Current vm.max_map_count: $(sysctl vm.max_map_count)"
          echo "Available memory: $(free -h)"
          echo "CPU info: $(nproc) cores"

      - name: Verify Docker environment
        run: |
          echo "=== Verifying Docker environment ==="
          docker --version
          docker info
          docker ps -a

      - name: Build ObservabilityTesting solution
        env:
          SKIP_DOCKER_BUILD: "true"
          RELEASE_VALIDATION_MODE: "PreRelease"
        run: |
          echo "🔨 Building ObservabilityTesting solution..."
          echo "   SKIP_DOCKER_BUILD=true (using pre-built Docker image from artifacts)"
          echo "   RELEASE_VALIDATION_MODE=PreRelease (using FlinkDotnet NuGet package from local feed)"
          dotnet restore ObservabilityTesting/ObservabilityTesting.sln
          dotnet build ObservabilityTesting/ObservabilityTesting.sln --configuration Release --no-restore

      - name: Run Pre-Release Validation Tests
        timeout-minutes: 12
        env:
          DOTNET_ENVIRONMENT: Testing
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
          SKIP_DOCKER_BUILD: "true"
          RELEASE_VALIDATION_MODE: "PreRelease"
        run: |
          echo "=== Running Pre-Release Validation Tests ==="
          dotnet test ObservabilityTesting/ObservabilityTesting.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=TestResults.trx" --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: PreReleaseTestResults
          path: TestResults/
        if: always()

  create-release:
    name: Create GitHub Release
    needs: [calculate-version, update-version, build-and-package, build-docker-image, build-standalone-executables, test-release-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.calculate-version.outputs.release_branch }}

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./docker

      - name: Download standalone executables
        uses: actions/download-artifact@v4
        with:
          name: standalone-executables
          path: ./standalone

      - name: Create Release with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ needs.calculate-version.outputs.new_version }}
          TAG="v$VERSION"
          
          # Use ReleaseNote.md content for release notes
          if [ -f ReleaseNote.md ]; then
            cp ReleaseNote.md release-notes.md
          else
            echo "## FlinkDotNet $VERSION" > release-notes.md
            echo "" >> release-notes.md
            echo "Release notes not provided." >> release-notes.md
          fi
          
          # Create release using GitHub CLI (this automatically creates the tag)
          gh release create "$TAG" \
            --title "FlinkDotNet $VERSION" \
            --notes-file release-notes.md \
            ./packages/*.nupkg \
            ./docker/jobgateway-*.tar.gz \
            ./standalone/jobgateway-win-x64-*.zip \
            ./standalone/jobgateway-linux-x64-*.tar.gz
      
      - name: Clear ReleaseNote.md after release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Empty ReleaseNote.md with placeholder text
          echo "<!-- This is a placeholder to automatically put release notes. -->" > ReleaseNote.md
          echo "" >> ReleaseNote.md
          echo "Add release notes here for the next release." >> ReleaseNote.md
          
          git add ReleaseNote.md
          git commit -m "Clear ReleaseNote.md after v${{ needs.calculate-version.outputs.new_version }} release"
          git push origin ${{ needs.calculate-version.outputs.release_branch }}
          echo "Cleared ReleaseNote.md with placeholder text"

  publish-packages:
    name: Publish NuGet Packages and Docker Image
    needs: [calculate-version, update-version, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.calculate-version.outputs.release_branch }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hub authentication
        run: |
          echo "Verifying Docker Hub authentication..."
          docker info | grep -i username || echo "Warning: Could not verify Docker username"
          echo "✅ Docker authentication verified"

      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: ./docker

      - name: Load and push Docker image with retry
        run: |
          VERSION=${{ needs.calculate-version.outputs.new_version }}
          
          echo "Loading Docker image..."
          gunzip -c ./docker/jobgateway-$VERSION.tar.gz | docker load
          echo "✅ Docker image loaded successfully"
          
          # Tag the loaded image with :latest
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:$VERSION ${{ env.DOCKER_IMAGE_NAME }}:latest
          echo "✅ Tagged image as latest"
          
          # List loaded images
          docker images | grep ${{ env.DOCKER_IMAGE_NAME }} || true
          
          # Function to push with retry
          push_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt of $max_attempts: Pushing $image..."
              
              if docker push "$image"; then
                echo "✅ Successfully pushed $image"
                return 0
              else
                echo "⚠️  Push failed for $image (attempt $attempt/$max_attempts)"
                if [ $attempt -lt $max_attempts ]; then
                  echo "Waiting 10 seconds before retry..."
                  sleep 10
                  
                  # Re-authenticate before retry
                  echo "Re-authenticating with Docker Hub..."
                  echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
                fi
              fi
              
              attempt=$((attempt + 1))
            done
            
            echo "❌ Failed to push $image after $max_attempts attempts"
            return 1
          }
          
          # Push version tag with retry
          push_with_retry "${{ env.DOCKER_IMAGE_NAME }}:$VERSION"
          
          # Push latest tag with retry
          push_with_retry "${{ env.DOCKER_IMAGE_NAME }}:latest"
          
          echo "✅ Docker image published successfully!"

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ./packages

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: DarrenDatBui

      - name: Publish to NuGet.org
        run: |
          echo "📦 Publishing packages to NuGet.org using Trusted Publishing..."
          dotnet nuget push "./packages/*.nupkg" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          echo "✅ NuGet packages published successfully!"

  validate-published-packages:
    name: Validate Published Packages (Post-Release Validation)
    needs: [calculate-version, publish-packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.calculate-version.outputs.release_branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: '3.9.6'

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install .NET Aspire workload
        run: |
          echo "📦 Installing .NET Aspire workload..."
          dotnet workload install aspire
          echo "✅ Aspire workload installed successfully"

      - name: Wait for NuGet.org indexing
        run: |
          echo "⏳ Waiting 2 minutes for NuGet.org to index the new package..."
          sleep 120

      - name: Clear NuGet cache
        run: |
          dotnet nuget locals all --clear
          echo "Cleared NuGet cache to force download from NuGet.org"

      - name: Pull Docker image from Docker Hub
        run: |
          VERSION=${{ needs.calculate-version.outputs.new_version }}
          echo "Pulling Docker image from Docker Hub..."
          docker pull ${{ env.DOCKER_IMAGE_NAME }}:$VERSION
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:$VERSION ${{ env.DOCKER_IMAGE_NAME }}:latest
          docker tag ${{ env.DOCKER_IMAGE_NAME }}:$VERSION flinkdotnet-gateway:local
          echo "✅ Docker image pulled from Docker Hub and tagged as latest and flinkdotnet-gateway:local"

      - name: Configure system for optimal performance
        run: |
          echo "=== Configuring system for optimal performance ==="
          sudo sysctl -w vm.max_map_count=262144
          sudo bash -c 'echo "* soft nofile 65536" >> /etc/security/limits.conf'
          sudo bash -c 'echo "* hard nofile 65536" >> /etc/security/limits.conf'
          echo "Current vm.max_map_count: $(sysctl vm.max_map_count)"
          echo "Available memory: $(free -h)"
          echo "CPU info: $(nproc) cores"

      - name: Verify Docker environment
        run: |
          echo "=== Verifying Docker environment ==="
          docker --version
          docker info
          docker ps -a

      - name: Build ObservabilityTesting solution
        env:
          SKIP_DOCKER_BUILD: "true"
          RELEASE_VALIDATION_MODE: "PostRelease"
        run: |
          echo "🔨 Building ObservabilityTesting solution..."
          echo "   SKIP_DOCKER_BUILD=true (using published Docker image from Docker Hub)"
          echo "   RELEASE_VALIDATION_MODE=PostRelease (using FlinkDotnet NuGet package from NuGet.org)"
          dotnet restore ObservabilityTesting/ObservabilityTesting.sln
          dotnet build ObservabilityTesting/ObservabilityTesting.sln --configuration Release --no-restore

      - name: Run Post-Release Validation Tests
        timeout-minutes: 12
        env:
          DOTNET_ENVIRONMENT: Testing
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
          DOCKER_HOST: "unix:///var/run/docker.sock"
          SKIP_DOCKER_BUILD: "true"
          RELEASE_VALIDATION_MODE: "PostRelease"
        run: |
          echo "=== Running Post-Release Validation Tests ==="
          dotnet test ObservabilityTesting/ObservabilityTesting.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=TestResults.trx" --results-directory TestResults

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: PostReleaseTestResults
          path: TestResults/
        if: always()

  merge-to-main:
    name: Merge Release Branch to Main
    needs: [calculate-version, validate-published-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.calculate-version.outputs.release_branch }}
      
      - name: Create Pull Request to Main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ needs.calculate-version.outputs.new_version }}
          RELEASE_BRANCH="${{ needs.calculate-version.outputs.release_branch }}"
          
          # Create PR to merge release branch to main
          PR_URL=$(gh pr create \
            --base main \
            --head "$RELEASE_BRANCH" \
            --title "Release v$VERSION" \
            --body "This PR merges the release branch for version $VERSION back to main.

          ## Release Summary
          - Version: $VERSION
          - Type: Minor Release
          - Packages published to NuGet.org
          - Docker image published to Docker Hub
          - GitHub release created with tag v$VERSION
          
          ## Validation
          - ✅ Pre-release tests passed
          - ✅ Packages published successfully
          - ✅ Post-release validation passed
          
          Please review and merge this PR manually. The release branch can be deleted after merge.")
          
          echo "Created PR: $PR_URL"
          echo "Please review and merge the PR manually to complete the release process."
