name: Release Flink IR Runner

on:
  workflow_dispatch:
  push:
    tags:
      - 'runner-v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Install Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: '3.9.11'
      - name: Build Runner (Java 25 and Java 17)
        working-directory: FlinkIRRunner
        run: |
          mvn -B -DskipTests clean package -Pjava25
          mvn -B -DskipTests package -Pjava17
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            FlinkIRRunner/target/flink-ir-runner.jar
            FlinkIRRunner/target/flink-ir-runner-java17.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
