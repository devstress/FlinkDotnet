name: Build Solutions

on:
  push:
  workflow_dispatch:

env:
  configuration: Release

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Install Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: '3.9.11'

      - name: Set up .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore .NET Solutions
        run: |
          dotnet restore FlinkDotNet/FlinkDotNet.sln

      - name: Install SonarCloud scanner
        run: |
          rm -rf ./.sonar/scanner
          mkdir -p ./.sonar/scanner
          dotnet tool install dotnet-sonarscanner --tool-path ./.sonar/scanner

      - name: Build
        shell: bash
        run: |
          # Build FlinkDotNet solution
          dotnet build FlinkDotNet/FlinkDotNet.sln --configuration ${{ env.configuration }} --no-restore

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-solutions
          path: |
            FlinkDotNet/**/bin/${{ env.configuration }}/

  unit_tests:
    needs: build
    uses: ./.github/workflows/unit-tests.yml

  localtesting_tests:
    needs: build
    uses: ./.github/workflows/localtesting-integration-tests.yml
