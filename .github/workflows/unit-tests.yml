name: Unit Tests

on:
  push:
  workflow_dispatch:

env:
  configuration: Release

concurrency:
  group: unit-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  run-unit-tests:
    name: Run .NET Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Install Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: '3.9.11'

      - name: Build FlinkDotNet solution
        shell: bash
        run: |
          echo "Building FlinkDotNet solution..."
          dotnet restore FlinkDotNet/FlinkDotNet.sln
          dotnet build FlinkDotNet/FlinkDotNet.sln --configuration ${{ env.configuration }} --no-restore

      - name: Run tests for FlinkDotNet solution
        run: |
          Write-Host "Running tests for FlinkDotNet/FlinkDotNet.sln..."
          Push-Location FlinkDotNet
          dotnet test FlinkDotNet.sln --configuration ${{ env.configuration }} --no-build --logger "trx" --results-directory "TestResults"
          Pop-Location

      - name: Verify Test Results
        run: |
          Write-Host "Unit tests completed successfully."
          Write-Host "Test Results Summary:"
          Get-ChildItem -Path "./FlinkDotNet/TestResults" -Recurse -Filter "*.trx" | ForEach-Object {
            Write-Host "  Test Result: $($_.FullName)"
          }

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            FlinkDotNet/TestResults/**/*.trx
          retention-days: 7

