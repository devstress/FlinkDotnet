name: Unit Tests

on:
  push:
  workflow_dispatch:

env:
  configuration: Release

concurrency:
  group: unit-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  run-unit-tests:
    name: Run .NET Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'  # Required for SonarQube Cloud

      - name: Install Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: '3.9.6'

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner

      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p ${{ runner.temp }}/scanner
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}/scanner

      - name: Begin SonarQube Cloud analysis
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner begin \
            /k:"devstress_flinkdotnet" \
            /o:"devstress" \
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" \
            /d:sonar.host.url="https://sonarcloud.io"

      - name: Build FlinkDotNet solution
        shell: bash
        run: |
          echo "Building FlinkDotNet solution..."
          dotnet restore FlinkDotNet/FlinkDotNet.sln
          dotnet build FlinkDotNet/FlinkDotNet.sln --configuration ${{ env.configuration }} --no-restore

      - name: Run tests for FlinkDotNet solution
        run: |
          Write-Host "Running tests for FlinkDotNet/FlinkDotNet.sln..."
          Push-Location FlinkDotNet
          dotnet test FlinkDotNet.sln --configuration ${{ env.configuration }} --no-build --logger "trx" --results-directory "TestResults"
          Pop-Location

      - name: End SonarQube Cloud analysis
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          ${{ runner.temp }}/scanner/dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Verify Test Results
        run: |
          Write-Host "Unit tests completed successfully."
          Write-Host "Test Results Summary:"
          Get-ChildItem -Path "./FlinkDotNet/TestResults" -Recurse -Filter "*.trx" | ForEach-Object {
            Write-Host "  Test Result: $($_.FullName)"
          }

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            FlinkDotNet/TestResults/**/*.trx
          retention-days: 7

