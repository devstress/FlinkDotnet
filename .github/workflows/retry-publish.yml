name: Retry Publish (NuGet & Docker)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
      release_tag:
        description: 'Release tag to fetch artifacts from (e.g., v1.0.0)'
        required: true
      skip_nuget:
        description: 'Skip NuGet publishing (yes/no)'
        required: false
        default: 'no'
      skip_docker:
        description: 'Skip Docker publishing (yes/no)'
        required: false
        default: 'no'

env:
  DOTNET_VERSION: '9.0.x'
  CONFIGURATION: 'Release'
  DOCKER_IMAGE_NAME: 'flinkdotnet/jobgateway'

jobs:
  publish-packages:
    name: Retry Publish NuGet Packages and Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Validate inputs
        run: |
          echo "Validating inputs..."
          VERSION="${{ github.event.inputs.version }}"
          TAG="${{ github.event.inputs.release_tag }}"
          SKIP_NUGET="${{ github.event.inputs.skip_nuget }}"
          SKIP_DOCKER="${{ github.event.inputs.skip_docker }}"
          
          # Validate version format
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ ERROR: Version must be in format X.Y.Z (e.g., 1.0.0)"
            exit 1
          fi
          
          # Validate tag format
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "❌ ERROR: Release tag must be in format vX.Y.Z (e.g., v1.0.0)"
            exit 1
          fi
          
          # Check if both publishing types are skipped
          if [ "$SKIP_NUGET" = "yes" ] && [ "$SKIP_DOCKER" = "yes" ]; then
            echo "❌ ERROR: Cannot skip both NuGet and Docker publishing"
            exit 1
          fi
          
          echo "✅ Input validation passed"
          echo "Version: $VERSION"
          echo "Release Tag: $TAG"
          echo "Skip NuGet: $SKIP_NUGET"
          echo "Skip Docker: $SKIP_DOCKER"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          VERSION="${{ github.event.inputs.version }}"
          SKIP_NUGET="${{ github.event.inputs.skip_nuget }}"
          SKIP_DOCKER="${{ github.event.inputs.skip_docker }}"
          
          echo "Downloading release assets from $TAG..."
          
          # Create directories
          mkdir -p ./packages
          mkdir -p ./docker
          
          # Download NuGet packages if not skipping
          if [ "$SKIP_NUGET" != "yes" ]; then
            echo "Downloading NuGet packages..."
            gh release download "$TAG" --pattern "*.nupkg" --dir ./packages || {
              echo "⚠️  Warning: No NuGet packages found in release $TAG"
            }
          fi
          
          # Download Docker image if not skipping
          if [ "$SKIP_DOCKER" != "yes" ]; then
            echo "Downloading Docker image tarball..."
            gh release download "$TAG" --pattern "jobgateway-*.tar.gz" --dir ./docker || {
              echo "❌ ERROR: Docker image tarball not found in release $TAG"
              exit 1
            }
          fi
          
          echo "Downloaded assets:"
          ls -la ./packages/ 2>/dev/null || echo "No packages downloaded"
          ls -la ./docker/ 2>/dev/null || echo "No Docker images downloaded"

      - name: NuGet login (OIDC → temp API key)
        if: github.event.inputs.skip_nuget != 'yes'
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: DarrenDatBui

      - name: Publish to NuGet.org
        if: github.event.inputs.skip_nuget != 'yes'
        run: |
          echo "📦 Publishing packages to NuGet.org using Trusted Publishing..."
          
          # Check if packages exist
          if [ ! -f ./packages/*.nupkg ]; then
            echo "❌ ERROR: No NuGet packages found to publish"
            exit 1
          fi
          
          dotnet nuget push "./packages/*.nupkg" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          echo "✅ NuGet packages published successfully!"

      - name: Set up Docker Buildx
        if: github.event.inputs.skip_docker != 'yes'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event.inputs.skip_docker != 'yes'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Verify Docker Hub authentication
        if: github.event.inputs.skip_docker != 'yes'
        run: |
          echo "Verifying Docker Hub authentication..."
          docker info | grep -i username || echo "Warning: Could not verify Docker username"
          echo "✅ Docker authentication verified"

      - name: Load and push Docker image with retry
        if: github.event.inputs.skip_docker != 'yes'
        run: |
          VERSION="${{ github.event.inputs.version }}"
          
          echo "Loading Docker image..."
          # Find and load the Docker image tarball
          DOCKER_TAR=$(find ./docker -name "jobgateway-*.tar.gz" | head -n 1)
          
          if [ -z "$DOCKER_TAR" ]; then
            echo "❌ ERROR: Docker image tarball not found in release assets"
            exit 1
          fi
          
          echo "Loading image from: $DOCKER_TAR"
          gunzip -c "$DOCKER_TAR" | docker load
          echo "✅ Docker image loaded successfully"
          
          # List loaded images
          docker images | grep ${{ env.DOCKER_IMAGE_NAME }} || true
          
          # Function to push with retry
          push_with_retry() {
            local image=$1
            local max_attempts=3
            local attempt=1
            
            while [ $attempt -le $max_attempts ]; do
              echo "Attempt $attempt of $max_attempts: Pushing $image..."
              
              if docker push "$image"; then
                echo "✅ Successfully pushed $image"
                return 0
              else
                echo "⚠️  Push failed for $image (attempt $attempt/$max_attempts)"
                if [ $attempt -lt $max_attempts ]; then
                  echo "Waiting 10 seconds before retry..."
                  sleep 10
                  
                  # Re-authenticate before retry
                  echo "Re-authenticating with Docker Hub..."
                  echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
                fi
              fi
              
              attempt=$((attempt + 1))
            done
            
            echo "❌ Failed to push $image after $max_attempts attempts"
            return 1
          }
          
          # Push version tag with retry
          push_with_retry "${{ env.DOCKER_IMAGE_NAME }}:$VERSION"
          
          # Push latest tag with retry
          push_with_retry "${{ env.DOCKER_IMAGE_NAME }}:latest"
          
          echo "✅ Docker image published successfully!"

      - name: Summary
        run: |
          echo "✅ Publishing completed successfully!"
          echo ""
          
          if [ "${{ github.event.inputs.skip_nuget }}" != "yes" ]; then
            echo "Published:"
            echo "  - NuGet packages version ${{ github.event.inputs.version }}"
          else
            echo "Skipped:"
            echo "  - NuGet publishing (as requested)"
          fi
          
          if [ "${{ github.event.inputs.skip_docker }}" != "yes" ]; then
            echo "Published:"
            echo "  - Docker image ${{ env.DOCKER_IMAGE_NAME }}:${{ github.event.inputs.version }}"
            echo "  - Docker image ${{ env.DOCKER_IMAGE_NAME }}:latest"
          else
            echo "Skipped:"
            echo "  - Docker publishing (as requested)"
          fi
