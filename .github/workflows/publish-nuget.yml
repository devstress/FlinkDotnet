name: Publish NuGet Packages

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish'
        required: true
        default: '1.0.0'

env:
  DOTNET_VERSION: '9.0.x'
  CONFIGURATION: 'Release'

jobs:
  publish:
    name: Build and Publish NuGet Packages
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'zulu'

      - name: Install Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: '3.9.11'

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Restore dependencies
        run: |
          dotnet restore FlinkDotNet/FlinkDotNet.sln

      - name: Build solutions
        run: |
          dotnet build FlinkDotNet/FlinkDotNet.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run unit tests
        run: |
          dotnet test FlinkDotNet/FlinkDotNet.sln --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

      - name: Create NuGet packages
        run: |
          # Update package versions in all projects
          VERSION=${{ steps.version.outputs.VERSION }}
          
          # Core FlinkDotNet packages
          dotnet pack FlinkDotNet/FlinkDotNet/FlinkDotNet.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./packages \
            -p:PackageVersion=$VERSION
            
          dotnet pack FlinkDotNet/FlinkDotNet.DataStream/FlinkDotNet.DataStream.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./packages \
            -p:PackageVersion=$VERSION
            
          dotnet pack FlinkDotNet/FlinkDotNet.Table/FlinkDotNet.Table.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./packages \
            -p:PackageVersion=$VERSION
            
          dotnet pack FlinkDotNet/FlinkDotNet.Common/FlinkDotNet.Common.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./packages \
            -p:PackageVersion=$VERSION
            
          dotnet pack FlinkDotNet/Flink.JobBuilder/Flink.JobBuilder.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./packages \
            -p:PackageVersion=$VERSION
            
          dotnet pack FlinkDotNet/Flink.JobGateway/Flink.JobGateway.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./packages \
            -p:PackageVersion=$VERSION
            
          # Enterprise components
          dotnet pack FlinkDotNet/FlinkDotNet.Temporal/FlinkDotNet.Temporal.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./packages \
            -p:PackageVersion=$VERSION
            
          dotnet pack FlinkDotNet/FlinkDotNet.ClusterManager/FlinkDotNet.ClusterManager.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./packages \
            -p:PackageVersion=$VERSION
            
          dotnet pack FlinkDotNet/FlinkDotNet.Orchestration/FlinkDotNet.Orchestration.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./packages \
            -p:PackageVersion=$VERSION
            
          dotnet pack FlinkDotNet/FlinkDotNet.Resilience/FlinkDotNet.Resilience.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./packages \
            -p:PackageVersion=$VERSION
            
          # Testing framework
          dotnet pack FlinkDotNet/FlinkDotNet.Testing/FlinkDotNet.Testing.csproj \
            --configuration ${{ env.CONFIGURATION }} \
            --no-build \
            --output ./packages \
            -p:PackageVersion=$VERSION

      - name: List generated packages
        run: |
          echo "Generated NuGet packages:"
          ls -la ./packages/*.nupkg

      - name: Publish to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "⚠️ NUGET_API_KEY not found. Packages will not be published."
            echo "To publish packages, add NUGET_API_KEY to repository secrets."
          else
            echo "📦 Publishing packages to NuGet.org..."
            dotnet nuget push "./packages/*.nupkg" \
              --api-key $NUGET_API_KEY \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
            echo "✅ Packages published successfully!"
          fi

      - name: Upload packages as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.version.outputs.VERSION }}
          path: ./packages/*.nupkg
          retention-days: 30

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: FlinkDotNet ${{ steps.version.outputs.VERSION }}
          body: |
            ## FlinkDotNet ${{ steps.version.outputs.VERSION }}
            
            ### NuGet Packages Published
            
            - **FlinkDotNet** - Core .NET API for Apache Flink 2.1.0
            - **FlinkDotNet.DataStream** - DataStream API with Python compatibility
            - **FlinkDotNet.Table** - Table API for structured data processing
            - **Flink.JobBuilder** - Fluent job builder with JSON IR generation
            - **FlinkDotNet.Temporal** - Temporal.io integration for workflows
            - **FlinkDotNet.ClusterManager** - Multi-cluster orchestration
            - **FlinkDotNet.Testing** - Testing framework for Flink applications
            
            ### Installation
            
            ```bash
            dotnet add package FlinkDotNet --version ${{ steps.version.outputs.VERSION }}
            ```
            
            ### Documentation
            
            See [README.md](README.md) for complete documentation and examples.
          draft: false
          prerelease: false

  validate-packages:
    name: Validate Published Packages
    needs: publish
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages-${{ needs.publish.outputs.VERSION || '1.0.0' }}
          path: ./packages

      - name: Validate package contents
        run: |
          echo "🔍 Validating NuGet package contents..."
          for package in ./packages/*.nupkg; do
            echo "Package: $(basename $package)"
            # Extract and validate package contents
            unzip -l "$package" | grep -E '\.(dll|xml|pdb)$' || echo "  No .NET assemblies found"
          done
          echo "✅ Package validation completed"
