name: Learning Course Tests

on:
  workflow_dispatch:  # Manual trigger only

env:
  configuration: Release

concurrency:
  group: learning-course-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test_exercises:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        day: [
          "Day01-Flink21-Fundamentals",
          "Day02-AI-Stream-Processing", 
          "Day03-Production-Backpressure",
          "Day04-Enterprise-Observability",
          "Day05-Temporal-Workflows",
          "Day06-Advanced-Windows-Joins",
          "Day07-Stress-Testing",
          "Day08-Exactly-Once-Semantics",
          "Day09-Performance-Optimization-Scaling",
          "Day10-Security-Privacy-Compliance",
          "Day11-Disaster-Recovery-Multi-Region",
          "Day12-Advanced-Streaming-Patterns",
          "Day13-Advanced-Testing-Chaos-Engineering",
          "Day14-Capstone-Project"
        ]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Aspire workload
        run: dotnet workload install aspire

      - name: Find and build all exercises for ${{ matrix.day }}
        shell: bash
        run: |
          cd LearningCourse/${{ matrix.day }}
          
          # Find all .csproj files in this day's exercises
          PROJECTS=$(find . -name "*.csproj" -type f | sort)
          
          if [ -z "$PROJECTS" ]; then
            echo "No C# projects found in ${{ matrix.day }}"
            echo "Checking for other project types..."
            
            # Check for solution files
            SOLUTIONS=$(find . -name "*.sln" -type f | sort)
            if [ ! -z "$SOLUTIONS" ]; then
              echo "Found solution files:"
              echo "$SOLUTIONS"
              for solution in $SOLUTIONS; do
                echo "Building solution: $solution"
                dotnet restore "$solution"
                dotnet build "$solution" --configuration ${{ env.configuration }} --no-restore
              done
            else
              echo "No .csproj or .sln files found in ${{ matrix.day }} - this may be documentation-only day"
            fi
          else
            echo "Found C# projects in ${{ matrix.day }}:"
            echo "$PROJECTS"
            
            # Build each project individually
            for project in $PROJECTS; do
              echo "Building project: $project"
              dotnet restore "$project"
              dotnet build "$project" --configuration ${{ env.configuration }} --no-restore
            done
          fi

      - name: Test run sample exercise for ${{ matrix.day }} (if applicable)
        shell: bash
        run: |
          cd LearningCourse/${{ matrix.day }}
          
          # Find a runnable project (first .csproj with Program.cs)
          RUNNABLE_PROJECT=""
          PROJECTS=$(find . -name "*.csproj" -type f | sort)
          
          for project in $PROJECTS; do
            project_dir=$(dirname "$project")
            if [ -f "$project_dir/Program.cs" ]; then
              RUNNABLE_PROJECT="$project"
              break
            fi
          done
          
          if [ ! -z "$RUNNABLE_PROJECT" ]; then
            echo "Testing sample run of: $RUNNABLE_PROJECT"
            project_dir=$(dirname "$RUNNABLE_PROJECT")
            
            # Run with timeout to avoid hanging
            timeout 30s dotnet run --project "$RUNNABLE_PROJECT" --configuration ${{ env.configuration }} || {
              exit_code=$?
              if [ $exit_code -eq 124 ]; then
                echo "Exercise ran for 30 seconds and was terminated (expected for demonstration exercises)"
              else
                echo "Exercise failed with exit code: $exit_code"
                exit $exit_code
              fi
            }
          else
            echo "No runnable projects found in ${{ matrix.day }} (no Program.cs files)"
          fi

      - name: Upload build artifacts for ${{ matrix.day }}
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts-${{ matrix.day }}
          path: |
            LearningCourse/${{ matrix.day }}/**/bin/${{ env.configuration }}/
          retention-days: 1

  summary:
    needs: build_and_test_exercises
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Learning Course Test Summary
        shell: bash
        run: |
          echo "🎓 Learning Course Tests Summary"
          echo "================================="
          echo ""
          
          # Check results from previous job
          if [ "${{ needs.build_and_test_exercises.result }}" == "success" ]; then
            echo "✅ All Learning Course exercises built and tested successfully!"
            echo ""
            echo "📚 Tested Days:"
            echo "   • Day01-Flink21-Fundamentals"
            echo "   • Day02-AI-Stream-Processing"
            echo "   • Day03-Production-Backpressure"
            echo "   • Day04-Enterprise-Observability"
            echo "   • Day05-Temporal-Workflows"
            echo "   • Day06-Advanced-Windows-Joins"
            echo "   • Day07-Stress-Testing"
            echo "   • Day08-Exactly-Once-Semantics"
            echo "   • Day09-Performance-Optimization-Scaling"
            echo "   • Day10-Security-Privacy-Compliance"
            echo "   • Day11-Disaster-Recovery-Multi-Region"
            echo "   • Day12-Advanced-Streaming-Patterns"
            echo "   • Day13-Advanced-Testing-Chaos-Engineering"
            echo "   • Day14-Capstone-Project"
            echo ""
            echo "🚀 All exercises are ready for students!"
          else
            echo "❌ Some Learning Course exercises had issues"
            echo "   Check individual job logs for details"
            echo "   Common issues:"
            echo "   • Missing project dependencies"
            echo "   • .NET version mismatches"
            echo "   • Compilation errors"
            exit 1
          fi