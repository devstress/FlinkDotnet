name: Observability Tests

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-observability-tests:
    name: Run Observability Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET Aspire workload
        run: |
          echo "📦 Installing .NET Aspire workload..."
          dotnet workload install aspire
          echo "✅ Aspire workload installed successfully"

      - name: Build LocalTesting Solution
        run: |
          echo "🔨 Building LocalTesting solution for observability testing..."
          dotnet restore LocalTesting/LocalTesting.sln
          dotnet build LocalTesting/LocalTesting.sln --configuration Release --no-restore

      - name: Run Observability Tests
        timeout-minutes: 45
        env:
          INTEGRATION_TEST_MODE: "OBSERVABILITY"
          GITHUB_ACTIONS: "true"
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
        run: |
          echo "🎭 Running observability tests..."
          echo "📋 Testing complete Kafka → Flink → Temporal pipeline with observability metrics"
          
          # Run LocalTesting integration tests with observability category
          cd LocalTesting
          
          # Run tests and capture both output and exit code
          set +e  # Don't exit on error immediately
          dotnet test LocalTesting.IntegrationTests/LocalTesting.IntegrationTests.csproj \
            --configuration Release \
            --logger "console;verbosity=detailed" \
            --no-build \
            --filter "Category=observability" 2>&1 | tee test-output.log
          
          # CRITICAL FIX: Use PIPESTATUS to get the exit code from dotnet test, not from tee
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          set -e  # Re-enable exit on error
          
          # Debug output to verify exit code capture
          echo "DEBUG: dotnet test exit code captured: $TEST_EXIT_CODE"
          
          # Set environment variable for later steps
          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "TEST_FAILED=true" >> $GITHUB_ENV
            echo "TEST_EXIT_CODE=$TEST_EXIT_CODE" >> $GITHUB_ENV
            echo "DEBUG: Setting TEST_FAILED=true, TEST_EXIT_CODE=$TEST_EXIT_CODE"
          else
            echo "TEST_FAILED=false" >> $GITHUB_ENV
            echo "TEST_EXIT_CODE=0" >> $GITHUB_ENV
            echo "DEBUG: Setting TEST_FAILED=false, TEST_EXIT_CODE=0"
          fi

      - name: Display Observability Report
        if: always()
        timeout-minutes: 10
        env:
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
        run: |
          echo "📋 OBSERVABILITY TEST REPORT"
          echo "========================================"
          
          # Check for test failures first and display errors prominently
          if [ "$TEST_FAILED" = "true" ] || [ ! -f "LocalTesting/Bin/observability-test-result.txt" ]; then
            echo ""
            echo "🚨 ERRORS DETECTED 🚨"
            echo "========================================"
            echo "❌ Test Exit Code: ${TEST_EXIT_CODE:-unknown}"
            echo "❌ Test Failed Status: ${TEST_FAILED:-unknown}"
            echo ""
            
            # Extract and display key error information from test output
            if [ -f "LocalTesting/test-output.log" ]; then
              echo "❌ Test Execution Errors:"
              echo ""
              
              # Show failed test results
              grep -A 5 -B 2 "Failed\|Error\|Exception\|Timeout" LocalTesting/test-output.log | head -50 || echo "No specific error patterns found in test output"
              
              echo ""
              echo "🔍 Last 100 lines of test output:"
              tail -100 LocalTesting/test-output.log
              
              echo ""
              echo "📊 Test Summary from log:"
              grep -E "(Passed|Failed|Skipped|Total)" LocalTesting/test-output.log | tail -5 || echo "No test summary found"
            else
              echo "❌ No test output log found at LocalTesting/test-output.log"
            fi
            
            echo ""
            echo "🔧 Common Solutions:"
            echo "• Check if .NET 9.0 SDK is properly installed"
            echo "• Verify Aspire workload installation"
            echo "• Ensure Docker is running for containerized services"
            echo "• Check infrastructure startup timeout (currently 45 minutes)"
            echo "• Verify Prometheus and Kafka services are accessible"
            echo ""
          fi
          
          # Display metrics if available
          if [ -f "LocalTesting/Bin/observability-test-result.txt" ]; then
            echo "✅ OBSERVABILITY METRICS SUCCESS"
            echo "========================================"
            echo "📁 Metrics file: LocalTesting/Bin/observability-test-result.txt"
            echo "📊 File size: $(stat -c%s "LocalTesting/Bin/observability-test-result.txt") bytes"
            echo "📅 Generated: $(stat -c%y "LocalTesting/Bin/observability-test-result.txt")"
            echo ""
            echo "📊 METRICS RESULTS:"
            echo ""
            cat "LocalTesting/Bin/observability-test-result.txt"
          else
            echo "⚠️ METRICS FILE MISSING"
            echo "========================================"
            echo "❌ Expected: LocalTesting/Bin/observability-test-result.txt"
            echo "❌ This indicates the observability test failed to complete successfully"
            echo ""
          fi
          
          echo ""
          echo "📋 REPORT COMPLETE"
          echo "========================================"

      - name: Fail Workflow on Test Failure
        if: always()
        run: |
          echo "DEBUG: Environment variables check:"
          echo "  TEST_FAILED=$TEST_FAILED"
          echo "  TEST_EXIT_CODE=$TEST_EXIT_CODE"
          
          if [ "$TEST_FAILED" = "true" ]; then
            echo "❌ WORKFLOW FAILURE: Observability tests failed with exit code ${TEST_EXIT_CODE:-unknown}"
            echo "❌ This workflow must fail to indicate test failure"
            echo "❌ Root cause: dotnet test command returned non-zero exit code"
            exit 1
          else
            echo "✅ All observability tests passed successfully"
            echo "✅ TEST_FAILED=$TEST_FAILED, TEST_EXIT_CODE=$TEST_EXIT_CODE"
          fi

      - name: Upload Observability Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-artifacts-${{ github.run_id }}
          path: |
            LocalTesting/Bin/observability-test-result.txt
            LocalTesting/test-output.log
          retention-days: 7