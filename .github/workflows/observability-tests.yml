name: Observability Tests

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-observability-tests:
    name: Run Observability Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET Aspire workload
        run: |
          echo "📦 Installing .NET Aspire workload..."
          dotnet workload install aspire
          echo "✅ Aspire workload installed successfully"

      - name: Build LocalTesting Solution
        run: |
          echo "🔨 Building LocalTesting solution for observability testing..."
          dotnet restore LocalTesting/LocalTesting.sln
          dotnet build LocalTesting/LocalTesting.sln --configuration Release --no-restore

      - name: Run Observability Tests
        timeout-minutes: 30
        env:
          INTEGRATION_TEST_MODE: "OBSERVABILITY"
          GITHUB_ACTIONS: "true"
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
        run: |
          echo "🎭 Running observability tests..."
          echo "📋 Testing complete Kafka → Flink → Temporal pipeline with observability metrics"
          
          # Run LocalTesting integration tests with observability category
          cd LocalTesting
          dotnet test LocalTesting.IntegrationTests/LocalTesting.IntegrationTests.csproj \
            --configuration Release \
            --logger "console;verbosity=detailed" \
            --no-build \
            --filter "Category=observability"

      - name: Display Observability Metrics
        if: always()
        timeout-minutes: 5
        env:
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
        run: |
          echo "📊 Displaying Observability Metrics Summary..."
          
          # Find and display metrics file in Bin directory
          if [ -f "LocalTesting/Bin/observability-test-result.txt" ]; then
            echo "📁 Metrics file found in LocalTesting/Bin/"
            ls -la LocalTesting/Bin/observability-test-result.txt
            
            echo ""
            echo "╔══════════════════════════════════════════════════════════════════════════════════════╗"
            echo "║                         📊 OBSERVABILITY METRICS RESULTS 📊                          ║"
            echo "╚══════════════════════════════════════════════════════════════════════════════════════╝"
            cat "LocalTesting/Bin/observability-test-result.txt"
            echo ""
            echo "╔══════════════════════════════════════════════════════════════════════════════════════╗"
            echo "║                               📁 FILE INFORMATION 📁                                 ║"
            echo "╚══════════════════════════════════════════════════════════════════════════════════════╝"
            echo "📄 File: LocalTesting/Bin/observability-test-result.txt"
            echo "📊 Size: $(stat -c%s "LocalTesting/Bin/observability-test-result.txt") bytes"
            echo "📅 Created: $(stat -c%y "LocalTesting/Bin/observability-test-result.txt")"
          else
            echo "⚠️ No metrics file found. Expected: LocalTesting/Bin/observability-test-result.txt"
          fi

      - name: Upload Observability Metrics Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-metrics-${{ github.run_id }}
          path: |
            LocalTesting/Bin/observability-test-result.txt
          retention-days: 7