name: Observability Tests - Comprehensive End-to-End Flow Metrics (Aspire Testing Framework)

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-observability-tests:
    name: Run Comprehensive End-to-End Observability Test with Aspire Testing Framework
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Docker is running
        run: docker info

      - name: Set up .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET Aspire workload
        run: |
          Write-Host "📦 Installing .NET Aspire workload..." -ForegroundColor Green
          dotnet workload install aspire
          Write-Host "✅ Aspire workload installed successfully" -ForegroundColor Green

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-solutions
        continue-on-error: true

      - name: Build LocalTesting solution for Aspire testing framework
        run: |
          Write-Host "🔨 Building LocalTesting solution for Aspire testing framework..." -ForegroundColor Green
          
          # Build FlinkDotNet core projects first
          Write-Host "Building FlinkDotNet core projects..." -ForegroundColor Yellow
          dotnet restore FlinkDotNet/FlinkDotNet.sln --verbosity minimal
          dotnet build FlinkDotNet/FlinkDotNet.sln --configuration Release --no-restore --verbosity minimal
          
          # Build LocalTesting solution (contains observability tests with Aspire testing framework)
          Write-Host "Building LocalTesting solution with Aspire testing framework..." -ForegroundColor Yellow
          dotnet restore LocalTesting/LocalTesting.sln --verbosity minimal
          dotnet build LocalTesting/LocalTesting.sln --configuration Release --no-restore --verbosity minimal

      - name: Run Observability Tests Using Aspire Testing Framework
        timeout-minutes: 30
        env:
          INTEGRATION_TEST_MODE: "OBSERVABILITY"
          GITHUB_ACTIONS: "true"
          ALLURE_RESULTS_DIRECTORY: "allure-results"
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
        run: |
          Write-Host "🎭 Running Single Comprehensive Observability Test with Aspire Testing Framework..." -ForegroundColor Green
          Write-Host "📋 Testing complete Kafka → Flink → Temporal pipeline with 1M messages" -ForegroundColor Green
          
          # Set environment variables for Aspire testing framework
          $env:INTEGRATION_TEST_MODE = "OBSERVABILITY"
          $env:GITHUB_ACTIONS = "true"
          $env:ALLURE_RESULTS_DIRECTORY = "allure-results"
          $env:ASPIRE_ALLOW_UNSECURED_TRANSPORT = "true"
          
          try {
            Write-Host "🚀 Starting Aspire testing framework for comprehensive end-to-end flow validation..." -ForegroundColor Yellow
            Write-Host "  📊 Single test validating complete Kafka → Flink → Temporal pipeline with 1M messages" -ForegroundColor Cyan
            Write-Host "  📈 No manual infrastructure management required" -ForegroundColor Cyan
            
            # Run LocalTesting integration tests with Aspire testing framework
            Push-Location LocalTesting
            dotnet test LocalTesting.IntegrationTests/LocalTesting.IntegrationTests.csproj --configuration Release --logger "console;verbosity=detailed" --logger trx --verbosity minimal --no-build --filter "Category=observability"
            Pop-Location
            
            if ($LASTEXITCODE -ne 0) {
              Write-Host "❌ Comprehensive observability test failed with Aspire testing framework" -ForegroundColor Red
              throw "Comprehensive observability test failed - see detailed output above"
            } else {
              Write-Host "🎉 Comprehensive observability test passed using Aspire testing framework!" -ForegroundColor Green
              Write-Host "  📊 Complete Kafka → Flink → Temporal pipeline validated with 1M messages" -ForegroundColor Cyan
              Write-Host "  📈 Tests validated messages-per-second metrics across Kafka, Flink, and Temporal" -ForegroundColor Cyan
            }
          }
          catch {
            Write-Host "❌ Comprehensive observability test execution failed: $_" -ForegroundColor Red
            throw
          }

      - name: Upload observability test results and Allure reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: observability-test-results
          path: |
            **/*.trx
            **/*.log
            **/*.txt
            **/allure-results/**
            **/allure-report/**
            LocalTesting/LocalTesting.IntegrationTests/bin/Release/net9.0/allure-results/**
            LocalTesting/LocalTesting.IntegrationTests/bin/Release/net9.0/allure-report/**