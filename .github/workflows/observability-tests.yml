name: Observability Tests

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-observability-tests:
    name: Run Observability Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET Aspire workload
        run: |
          echo "📦 Installing .NET Aspire workload..."
          dotnet workload install aspire
          echo "✅ Aspire workload installed successfully"

      - name: Build LocalTesting Solution
        run: |
          echo "🔨 Building LocalTesting solution for observability testing..."
          dotnet restore LocalTesting/LocalTesting.sln
          dotnet build LocalTesting/LocalTesting.sln --configuration Release --no-restore

      - name: Run Observability Tests
        timeout-minutes: 30
        env:
          INTEGRATION_TEST_MODE: "OBSERVABILITY"
          GITHUB_ACTIONS: "true"
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
        run: |
          echo "🎭 Running observability tests..."
          echo "📋 Testing complete Kafka → Flink → Temporal pipeline with observability metrics"
          
          # Run LocalTesting integration tests with observability category
          cd LocalTesting
          dotnet test LocalTesting.IntegrationTests/LocalTesting.IntegrationTests.csproj \
            --configuration Release \
            --logger "console;verbosity=detailed" \
            --no-build \
            --filter "Category=observability"

      - name: Display Observability Metrics
        if: always()
        timeout-minutes: 5
        env:
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
        run: |
          echo "📊 Displaying Observability Metrics Summary..."
          
          # Find and display metrics files if they exist
          if [ -d "LocalTesting/metrics" ]; then
            echo "📁 Metrics files found in LocalTesting/metrics:"
            ls -la LocalTesting/metrics/
            
            # Display the latest metrics file
            LATEST_METRICS_FILE=$(find LocalTesting/metrics -name "observability-metrics-*.txt" -type f -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
            if [ -n "$LATEST_METRICS_FILE" ]; then
              echo ""
              echo "╔══════════════════════════════════════════════════════════════════════════════════════╗"
              echo "║                         📊 LATEST OBSERVABILITY METRICS 📊                           ║"
              echo "╚══════════════════════════════════════════════════════════════════════════════════════╝"
              cat "$LATEST_METRICS_FILE"
              echo ""
              echo "╔══════════════════════════════════════════════════════════════════════════════════════╗"
              echo "║                               📁 FILE INFORMATION 📁                                 ║"
              echo "╚══════════════════════════════════════════════════════════════════════════════════════╝"
              echo "📄 File: $LATEST_METRICS_FILE"
              echo "📊 Size: $(stat -c%s "$LATEST_METRICS_FILE") bytes"
              echo "📅 Created: $(stat -c%y "$LATEST_METRICS_FILE")"
            else
              echo "⚠️ No metrics text files found"
            fi
            
            # Display JSON metrics if available
            LATEST_JSON_FILE=$(find LocalTesting/metrics -name "observability-metrics-*.json" -type f -printf '%T@ %p\n' | sort -n | tail -1 | cut -d' ' -f2-)
            if [ -n "$LATEST_JSON_FILE" ]; then
              echo ""
              echo "📄 JSON Metrics File: $LATEST_JSON_FILE"
              echo "📊 JSON Size: $(stat -c%s "$LATEST_JSON_FILE") bytes"
            fi
          else
            echo "⚠️ No metrics directory found. Metrics may not have been generated."
          fi

      - name: Upload Observability Metrics Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-metrics-${{ github.run_id }}
          path: |
            LocalTesting/metrics/
          retention-days: 7