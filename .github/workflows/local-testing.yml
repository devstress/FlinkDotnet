              } else {
                Write-Host "⚠️ Service Changes: $($initialState.ServiceUpCount) → $($finalState.ServiceUpCount) services up" -ForegroundColor Yellow
              }
              
              # Message flow analysis
              if ($finalState.HttpRequestsTotal -ne "N/A" -and $initialState.HttpRequestsTotal -ne "N/A") {
                try {
                  $httpDelta = [double]$finalState.HttpRequestsTotal - [double]$initialState.HttpRequestsTotal
                  if ($httpDelta -gt 0) {
                    Write-Host "✅ HTTP Request Activity: +$httpDelta requests during stress test" -ForegroundColor Green
                  }
                } catch {
                  Write-Host "📊 HTTP Request Metrics: Data collected but comparison unavailable" -ForegroundColor Cyan
                }
              }
              
              if ($finalState.KafkaMessagesSent -ne "N/A" -and $initialState.KafkaMessagesSent -ne "N/A" -and 
                  $finalState.KafkaMessagesSent -ne "No data" -and $initialState.KafkaMessagesSent -ne "No data") {
                try {
                  $kafkaDelta = [double]$finalState.KafkaMessagesSent - [double]$initialState.KafkaMessagesSent
                  if ($kafkaDelta -gt 0) {
                    Write-Host "✅ Kafka Message Flow: +$kafkaDelta messages sent during stress test" -ForegroundColor Green
                  }
                } catch {
                  Write-Host "📊 Kafka Message Metrics: Data collected but comparison unavailable" -ForegroundColor Cyan
                }
              }
              
              Write-Host "🎯 OBSERVABILITY VERIFICATION: Message flow monitoring successfully tracked throughout all 8 business flow steps" -ForegroundColor Green
            }
            
          }
          catch {
            Write-Host "❌ Business flow test failed: $($_.Exception.Message)" -ForegroundColor Red
            Write-Host "Response details: $($_.Exception.Response | Out-String)" -ForegroundColor Yellow
            $testResults += @{Step="Error"; Status="Failed"; Success=$false; Error=$_.Exception.Message}
            $overallSuccess = $false
          }
          
          # Summary Report
          Write-Host "`n📋 Complex Logic Stress Test Business Flow Results:" -ForegroundColor Green
          
          $successfulSteps = ($testResults | Where-Object { $_.Success -eq $true }).Count
          $totalSteps = $testResults.Count
          
          foreach ($result in $testResults) {
            $status = if ($result.Success) { "✅ PASSED" } else { "❌ FAILED" }
            Write-Host "  $($result.Step): $status - $($result.Status)" -ForegroundColor $(if ($result.Success) { "Green" } else { "Red" })
          }
          
          Write-Host "Overall Result: $successfulSteps/$totalSteps steps passed" -ForegroundColor $(if ($overallSuccess) { "Green" } else { "Red" })
          
          if ($overallSuccess) {
            Write-Host "🎉 ALL BUSINESS FLOWS COMPLETED SUCCESSFULLY!" -ForegroundColor Green
            Write-Host "The LocalTesting environment successfully executed complex logic stress test scenarios" -ForegroundColor Cyan
          } else {
            Write-Host "❌ SOME BUSINESS FLOWS FAILED" -ForegroundColor Red
            throw "Business flow validation failed - see test results above"
          }

