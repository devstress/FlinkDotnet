name: Local Testing - Interactive Environment Validation

on:
  workflow_call:
  workflow_dispatch:

jobs:
  run-local-testing-validation:
    name: Run Local Testing Interactive Environment Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Docker is running
        run: docker info

      - name: Set up .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install .NET Aspire workload
        run: |
          Write-Host "📦 Installing .NET Aspire workload..." -ForegroundColor Green
          dotnet workload install aspire
          Write-Host "✅ Aspire workload installed successfully" -ForegroundColor Green

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-solutions

      - name: Build LocalTesting Solution
        run: |
          Write-Host "🔨 Building LocalTesting solution..." -ForegroundColor Green
          dotnet restore LocalTesting/LocalTesting.sln
          dotnet build LocalTesting/LocalTesting.sln --configuration Release --no-restore

      - name: Verify LocalTesting Build Artifacts
        run: |
          Write-Host "🔍 Verifying LocalTesting build artifacts..." -ForegroundColor Green
          
          $appHostDll = "LocalTesting/LocalTesting.AppHost/bin/Release/net9.0/LocalTesting.AppHost.dll"
          $webApiDll = "LocalTesting/LocalTesting.WebApi/bin/Release/net9.0/LocalTesting.WebApi.dll"
          
          if (Test-Path $appHostDll) {
            Write-Host "✅ AppHost build artifact found: $appHostDll" -ForegroundColor Green
          } else {
            Write-Host "❌ AppHost build artifact missing: $appHostDll" -ForegroundColor Red
            throw "LocalTesting.AppHost build failed"
          }
          
          if (Test-Path $webApiDll) {
            Write-Host "✅ WebApi build artifact found: $webApiDll" -ForegroundColor Green
          } else {
            Write-Host "❌ WebApi build artifact missing: $webApiDll" -ForegroundColor Red
            throw "LocalTesting.WebApi build failed"
          }

      - name: Start LocalTesting Aspire Environment
        timeout-minutes: 15
        run: |
          Write-Host "🚀 Starting LocalTesting Aspire environment..." -ForegroundColor Green
          
          # Verify Aspire is working by testing the project build
          Write-Host "Verifying Aspire functionality..." -ForegroundColor Yellow
          Push-Location LocalTesting/LocalTesting.AppHost
          try {
            $buildOutput = dotnet build --configuration Release --verbosity quiet 2>&1
            if ($LASTEXITCODE -eq 0) {
              Write-Host "✅ Aspire is functional and project builds successfully" -ForegroundColor Green
            } else {
              Write-Host "❌ Aspire build failed. Output:" -ForegroundColor Red
              Write-Host $buildOutput -ForegroundColor Red
              throw "Aspire functionality test failed"
            }
          }
          catch {
            Write-Host "❌ Aspire verification failed: $($_.Exception.Message)" -ForegroundColor Red
            throw "Aspire is not properly configured"
          }
          finally {
            Pop-Location
          }
          
          # Start the Aspire environment as a background process
          Push-Location LocalTesting/LocalTesting.AppHost
          
          # Set DCP and Dashboard paths for Aspire orchestration first
          $nugetPackages = "$HOME/.nuget/packages"
          
          # Set DCP CLI path using the installed orchestration package
          $dcpPath = "$nugetPackages/aspire.hosting.orchestration.linux-x64/9.1.0/tools/dcp"
          if (Test-Path $dcpPath) {
            $env:DCP_CLI_PATH = $dcpPath
            Write-Host "✅ DCP CLI path set: $dcpPath" -ForegroundColor Green
          } else {
            Write-Host "❌ DCP CLI path not found at expected location: $dcpPath" -ForegroundColor Red
            throw "DCP CLI path is required but not found"
          }
          
          # Set Aspire Dashboard path using the installed dashboard SDK
          $dashboardPath = "$nugetPackages/aspire.dashboard.sdk.linux-x64/9.1.0/tools"  
          if (Test-Path $dashboardPath) {
            $env:ASPIRE_DASHBOARD_PATH = $dashboardPath
            Write-Host "✅ Aspire Dashboard path set: $dashboardPath" -ForegroundColor Green
          } else {
            Write-Host "❌ Aspire Dashboard path not found at expected location: $dashboardPath" -ForegroundColor Red
            throw "Aspire Dashboard path is required but not found"
          }
          
          # Set all required environment variables for Aspire
          $env:ASPIRE_ALLOW_UNSECURED_TRANSPORT = "true"
          $env:ASPNETCORE_URLS = "http://localhost:15000"
          $env:DOTNET_DASHBOARD_OTLP_ENDPOINT_URL = "http://localhost:4323"
          $env:DOTNET_DASHBOARD_OTLP_HTTP_ENDPOINT_URL = "http://localhost:4324" 
          $env:ASPIRE_DASHBOARD_URL = "http://localhost:18888"
          $env:ASPNETCORE_ENVIRONMENT = "Development"
          $env:DOTNET_LAUNCH_PROFILE = ""
          
          Write-Host "Environment variables set:" -ForegroundColor Yellow
          Write-Host "  ASPNETCORE_URLS: $env:ASPNETCORE_URLS" -ForegroundColor Cyan
          Write-Host "  ASPIRE_DASHBOARD_OTLP_ENDPOINT_URL: $env:ASPIRE_DASHBOARD_OTLP_ENDPOINT_URL" -ForegroundColor Cyan
          Write-Host "  ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL: $env:ASPIRE_DASHBOARD_OTLP_HTTP_ENDPOINT_URL" -ForegroundColor Cyan
          Write-Host "  DCP_CLI_PATH: $env:DCP_CLI_PATH" -ForegroundColor Cyan
          Write-Host "  ASPIRE_DASHBOARD_PATH: $env:ASPIRE_DASHBOARD_PATH" -ForegroundColor Cyan
          
          Write-Host "Starting Aspire AppHost as background process..." -ForegroundColor Yellow
          try {
            # Start Aspire as a background process and capture the process ID
            $aspireProcess = Start-Process -FilePath "dotnet" -ArgumentList "run", "--configuration", "Release" -PassThru -RedirectStandardOutput "aspire_output.log" -RedirectStandardError "aspire_error.log" -NoNewWindow
            $global:AspirePID = $aspireProcess.Id
            Write-Host "✅ Aspire AppHost started in background (PID: $global:AspirePID)" -ForegroundColor Green
            
            # Wait for initial startup and check for startup success
            Write-Host "Waiting for Aspire to initialize..." -ForegroundColor Yellow
            Start-Sleep -Seconds 45
            
            # Check startup output
            $startupOutput = ""
            if (Test-Path "aspire_output.log") {
              $startupOutput += Get-Content "aspire_output.log" -Raw
            }
            if (Test-Path "aspire_error.log") {
              $errorOutput = Get-Content "aspire_error.log" -Raw
              if ($errorOutput) {
                $startupOutput += "`nErrors: $errorOutput"
              }
            }
            
            # Check for startup success indicators
            if ($startupOutput -match "Distributed application starting" -and $startupOutput -match "Aspire version") {
              Write-Host "✅ Aspire environment startup successful" -ForegroundColor Green
            } else {
              Write-Host "❌ Aspire startup may have failed - missing expected startup messages:" -ForegroundColor Red
              Write-Host $startupOutput -ForegroundColor Red
              throw "Aspire startup failed with configuration errors"
            }
          }
          catch {
            Write-Host "❌ Failed to start Aspire environment: $($_.Exception.Message)" -ForegroundColor Red
            if ($startupOutput) {
              Write-Host "Startup output:" -ForegroundColor Yellow
              Write-Host $startupOutput -ForegroundColor Yellow
            }
            
            Pop-Location
            throw "Aspire environment startup failed: $($_.Exception.Message)"
          }
          
          Pop-Location

      - name: Wait for Services to Start
        timeout-minutes: 8
        run: |
          Write-Host "⏳ Waiting for services to start and become healthy..." -ForegroundColor Green
          
          # Wait for services to start (give them more time to initialize, especially Temporal)
          Write-Host "Waiting for basic containers to start..." -ForegroundColor Yellow
          Start-Sleep -Seconds 60
          
          Write-Host "Checking initial container status..." -ForegroundColor Yellow
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          
          Write-Host "Waiting additional time for Temporal stack to initialize..." -ForegroundColor Yellow
          Start-Sleep -Seconds 120
          
          Write-Host "Checking Docker containers..." -ForegroundColor Yellow
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
          
          # Check if we have some containers running
          $containerCount = (docker ps --format "{{.Names}}" | Measure-Object).Count
          Write-Host "Found $containerCount running containers" -ForegroundColor Cyan
          
          # Show any containers that failed to start
          $failedContainers = docker ps -a --filter "status=exited" --format "{{.Names}}"
          if ($failedContainers) {
            Write-Host "⚠️ Containers that failed to start:" -ForegroundColor Yellow
            $failedContainers | ForEach-Object { 
              Write-Host "  - $_" -ForegroundColor Red
              Write-Host "    Last few log lines:" -ForegroundColor Yellow
              docker logs --tail 10 $_ 2>&1 | ForEach-Object { Write-Host "      $_" -ForegroundColor Cyan }
            }
          }
          
          if ($containerCount -eq 0) {
            Write-Host "❌ No Docker containers are running. Aspire environment failed to start properly." -ForegroundColor Red
            throw "Aspire environment startup failed - no containers are running"
          }
          
          Write-Host "✅ $containerCount containers are running" -ForegroundColor Green

      - name: Validate Infrastructure Components and API Accessibility
        timeout-minutes: 8
        run: |
          Write-Host "🔍 Validating infrastructure components and API accessibility..." -ForegroundColor Green
          
          $missingServices = @()
          
          # Check for Kafka containers
          $kafkaContainers = docker ps --filter "name=kafka" --format "{{.Names}}"
          if ($kafkaContainers) {
            Write-Host "✅ Kafka containers found:" -ForegroundColor Green
            $kafkaContainers | ForEach-Object { Write-Host "  - $_" -ForegroundColor Cyan }
          } else {
            Write-Host "❌ No Kafka containers found" -ForegroundColor Red
            $missingServices += "Kafka"
          }
          
          # Check for Flink containers
          $flinkContainers = docker ps --filter "name=flink" --format "{{.Names}}"
          if ($flinkContainers) {
            Write-Host "✅ Flink containers found:" -ForegroundColor Green
            $flinkContainers | ForEach-Object { Write-Host "  - $_" -ForegroundColor Cyan }
          } else {
            Write-Host "❌ No Flink containers found" -ForegroundColor Red
            $missingServices += "Flink"
          }
          
          # Check for Redis containers
          $redisContainers = docker ps --filter "name=redis" --format "{{.Names}}"
          if ($redisContainers) {
            Write-Host "✅ Redis containers found:" -ForegroundColor Green
            $redisContainers | ForEach-Object { Write-Host "  - $_" -ForegroundColor Cyan }
          } else {
            Write-Host "❌ No Redis containers found" -ForegroundColor Red
            $missingServices += "Redis"
          }
          
          # Check for Temporal containers (all three: postgres, server, ui)
          $temporalContainers = docker ps --filter "name=temporal" --format "{{.Names}}"
          if ($temporalContainers) {
            Write-Host "✅ Temporal containers found:" -ForegroundColor Green
            $temporalContainers | ForEach-Object { Write-Host "  - $_" -ForegroundColor Cyan }
            
            # Verify we have all required Temporal components
            $hasPostgres = $temporalContainers | Where-Object { $_ -match "postgres" }
            $hasServer = $temporalContainers | Where-Object { $_ -match "server" -and $_ -notmatch "postgres" }
            $hasUI = $temporalContainers | Where-Object { $_ -match "ui" -and $_ -notmatch "server" }
            
            if (-not $hasPostgres) {
              Write-Host "❌ Temporal PostgreSQL container missing" -ForegroundColor Red
              $missingServices += "Temporal PostgreSQL"
            }
            if (-not $hasServer) {
              Write-Host "❌ Temporal Server container missing" -ForegroundColor Red
              $missingServices += "Temporal Server"
            }
            if (-not $hasUI) {
              Write-Host "❌ Temporal UI container missing" -ForegroundColor Red
              $missingServices += "Temporal UI"
            }
          } else {
            Write-Host "❌ No Temporal containers found" -ForegroundColor Red
            $missingServices += "Temporal (PostgreSQL, Server, UI)"
          }
          
          # Show detailed container information for debugging
          Write-Host "`n🔍 All running containers for debugging:" -ForegroundColor Yellow
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
          
          # Check for failed containers that might give us clues
          $failedContainers = docker ps -a --filter "status=exited" --format "{{.Names}}"
          if ($failedContainers) {
            Write-Host "`n⚠️ Failed containers found:" -ForegroundColor Yellow
            $failedContainers | ForEach-Object { 
              Write-Host "  - $_" -ForegroundColor Red
              Write-Host "    Exit status and logs:" -ForegroundColor Yellow
              docker inspect $_ --format "{{.State.ExitCode}}: {{.State.Error}}"
              Write-Host "    Last 5 log lines:" -ForegroundColor Yellow
              docker logs --tail 5 $_ 2>&1 | ForEach-Object { Write-Host "      $_" -ForegroundColor Cyan }
            }
          }
          
          # Test API endpoint accessibility for all services including LocalTesting API
          Write-Host "`n🌐 Testing API and UI endpoint accessibility..." -ForegroundColor Green
          
          # Check if we can reach the LocalTesting API and other UI endpoints
          $testEndpoints = @(
            @{Port=5000; Name="LocalTesting API"; Path="/"; Critical=$true},
            @{Port=8082; Name="Kafka UI"; Path="/"; Critical=$false},
            @{Port=8084; Name="Temporal UI"; Path="/"; Critical=$true},
            @{Port=3000; Name="Grafana"; Path="/"; Critical=$false},
            @{Port=8081; Name="Flink JobManager UI"; Path="/"; Critical=$false}
          )
          
          $accessibleEndpoints = @()
          $failedEndpoints = @()
          $endpointMissingServices = @()
          
          foreach ($endpoint in $testEndpoints) {
            try {
              Write-Host "Testing $($endpoint.Name) on port $($endpoint.Port)..." -ForegroundColor Yellow
              $uri = "http://localhost:$($endpoint.Port)$($endpoint.Path)"
              $response = Invoke-WebRequest -Uri $uri -TimeoutSec 10 -ErrorAction SilentlyContinue
              if ($response.StatusCode -eq 200) {
                Write-Host "✅ $($endpoint.Name) is accessible (Status: $($response.StatusCode))" -ForegroundColor Green
                $accessibleEndpoints += $endpoint.Name
              }
            }
            catch {
              Write-Host "❌ $($endpoint.Name) not accessible: $($_.Exception.Message)" -ForegroundColor Red
              $failedEndpoints += $endpoint.Name
              if ($endpoint.Critical) {
                $endpointMissingServices += $endpoint.Name
              }
            }
          }
          
          # Combine container validation failures with endpoint failures (avoiding duplicates)
          $allMissingServices = $missingServices + $endpointMissingServices | Select-Object -Unique
          
          # Combined validation: fail if either containers are missing OR critical APIs are inaccessible
          if ($allMissingServices.Count -gt 0) {
            Write-Host "`n❌ Missing critical infrastructure services: $($allMissingServices -join ', ')" -ForegroundColor Red
            Write-Host "This indicates that the Aspire environment failed to start all required services." -ForegroundColor Red
            
            if ($accessibleEndpoints.Count -gt 0) {
              Write-Host "✅ Accessible services: $($accessibleEndpoints -join ', ')" -ForegroundColor Green
            }
            if ($failedEndpoints.Count -gt 0) {
              Write-Host "❌ Failed services: $($failedEndpoints -join ', ')" -ForegroundColor Red
            }
            
            throw "Critical infrastructure services are missing: $($allMissingServices -join ', '). Aspire environment startup failed."
          }
          
          Write-Host "`n✅ All critical infrastructure components and APIs are running and accessible" -ForegroundColor Green
          Write-Host "✅ Accessible services: $($accessibleEndpoints -join ', ')" -ForegroundColor Green
          if ($failedEndpoints.Count -gt 0) {
            Write-Host "⚠️ Inaccessible non-critical services: $($failedEndpoints -join ', ')" -ForegroundColor Yellow
          }

      - name: Validate Observability Stack Functionality
        timeout-minutes: 10
        run: |
          Write-Host "📊 Validating Observability Stack Functionality..." -ForegroundColor Green
          Write-Host "Testing Prometheus metrics, Grafana connectivity, and OpenTelemetry data collection" -ForegroundColor Cyan
          
          $observabilityResults = @()
          $observabilitySuccess = $true
          
          # Test Prometheus metrics endpoint and data availability
          Write-Host "`n🎯 Testing Prometheus metrics collection..." -ForegroundColor Yellow
          try {
            # Test Prometheus server health
            $prometheusHealth = Invoke-RestMethod -Uri "http://localhost:9090/-/healthy" -Method GET -TimeoutSec 10
            Write-Host "✅ Prometheus server is healthy" -ForegroundColor Green
            
            # Test metrics data availability from different targets
            $metricsQueries = @(
              @{Name="Up Status"; Query="up"; Expected="Service status metrics"},
              @{Name="Flink JobManager"; Query="flink_jobmanager_Status_JVM_Memory_Heap_Used"; Expected="Flink memory metrics"},
              @{Name="OTLP Collector"; Query="otelcol_receiver_accepted_spans_total"; Expected="OpenTelemetry collector metrics"},
              @{Name="HTTP Requests"; Query="http_requests_total"; Expected="Application HTTP metrics"}
            )
            
            foreach ($query in $metricsQueries) {
              try {
                $queryUrl = "http://localhost:9090/api/v1/query?query=$($query.Query)"
                $result = Invoke-RestMethod -Uri $queryUrl -Method GET -TimeoutSec 5
                if ($result.status -eq "success" -and $result.data.result.Count -gt 0) {
                  Write-Host "✅ $($query.Name): $($result.data.result.Count) metrics found" -ForegroundColor Green
                  $observabilityResults += @{Component="Prometheus-$($query.Name)"; Status="Data Available"; Success=$true}
                } else {
                  Write-Host "⚠️ $($query.Name): No data yet (services may be starting)" -ForegroundColor Yellow
                  $observabilityResults += @{Component="Prometheus-$($query.Name)"; Status="No Data Yet"; Success=$true}
                }
              } catch {
                Write-Host "⚠️ $($query.Name): Query failed - $($_.Exception.Message)" -ForegroundColor Yellow
                $observabilityResults += @{Component="Prometheus-$($query.Name)"; Status="Query Failed"; Success=$true}
              }
            }
          } catch {
            Write-Host "❌ Prometheus health check failed: $($_.Exception.Message)" -ForegroundColor Red
            $observabilityResults += @{Component="Prometheus"; Status="Failed"; Success=$false}
            $observabilitySuccess = $false
          }
          
          # Test Grafana datasource connectivity
          Write-Host "`n📈 Testing Grafana datasource connectivity..." -ForegroundColor Yellow
          try {
            # Test Grafana health
            $grafanaHealth = Invoke-RestMethod -Uri "http://localhost:3000/api/health" -Method GET -TimeoutSec 10
            Write-Host "✅ Grafana server is healthy: $($grafanaHealth.database)" -ForegroundColor Green
            
            # Test datasource connectivity (admin:admin default credentials)
            $grafanaAuth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("admin:admin"))
            $headers = @{"Authorization" = "Basic $grafanaAuth"}
            
            $datasources = Invoke-RestMethod -Uri "http://localhost:3000/api/datasources" -Method GET -Headers $headers -TimeoutSec 10
            foreach ($ds in $datasources) {
              Write-Host "✅ Grafana datasource: $($ds.name) ($($ds.type)) - URL: $($ds.url)" -ForegroundColor Green
            }
            
            # Test Prometheus datasource connectivity
            $prometheusDS = $datasources | Where-Object { $_.name -eq "Prometheus" }
            if ($prometheusDS) {
              try {
                $testUrl = "http://localhost:3000/api/datasources/$($prometheusDS.id)/health"
                $healthTest = Invoke-RestMethod -Uri $testUrl -Method GET -Headers $headers -TimeoutSec 10
                Write-Host "✅ Prometheus datasource connectivity verified" -ForegroundColor Green
                $observabilityResults += @{Component="Grafana-Prometheus"; Status="Connected"; Success=$true}
              } catch {
                Write-Host "⚠️ Prometheus datasource test: $($_.Exception.Message)" -ForegroundColor Yellow
                $observabilityResults += @{Component="Grafana-Prometheus"; Status="Connection Issue"; Success=$true}
              }
            }
            
            $observabilityResults += @{Component="Grafana"; Status="Operational"; Success=$true}
          } catch {
            Write-Host "❌ Grafana connectivity test failed: $($_.Exception.Message)" -ForegroundColor Red
            $observabilityResults += @{Component="Grafana"; Status="Failed"; Success=$false}
            $observabilitySuccess = $false
          }
          
          # Test OpenTelemetry Collector functionality
          Write-Host "`n🔭 Testing OpenTelemetry Collector data processing..." -ForegroundColor Yellow
          try {
            # Test OTLP endpoints
            $otlpEndpoints = @(
              @{Name="OTLP HTTP"; Url="http://localhost:4318/v1/traces"; Method="POST"},
              @{Name="OTLP gRPC Health"; Url="http://localhost:4317"; Method="GET"},
              @{Name="Prometheus Export"; Url="http://localhost:8889/metrics"; Method="GET"}
            )
            
            foreach ($endpoint in $otlpEndpoints) {
              try {
                if ($endpoint.Method -eq "GET") {
                  $response = Invoke-WebRequest -Uri $endpoint.Url -Method GET -TimeoutSec 5
                  if ($response.StatusCode -eq 200) {
                    Write-Host "✅ $($endpoint.Name): Endpoint accessible" -ForegroundColor Green
                    if ($endpoint.Name -eq "Prometheus Export") {
                      $metricsContent = $response.Content
                      $metricLines = ($metricsContent -split "`n" | Where-Object { $_ -match "^[a-zA-Z]" }).Count
                      Write-Host "   📊 Exported metrics: $metricLines metric types" -ForegroundColor Cyan
                    }
                  }
                }
                $observabilityResults += @{Component="OTLP-$($endpoint.Name)"; Status="Accessible"; Success=$true}
              } catch {
                Write-Host "⚠️ $($endpoint.Name): $($_.Exception.Message)" -ForegroundColor Yellow
                $observabilityResults += @{Component="OTLP-$($endpoint.Name)"; Status="Connection Issue"; Success=$true}
              }
            }
          } catch {
            Write-Host "❌ OpenTelemetry Collector tests failed: $($_.Exception.Message)" -ForegroundColor Red
            $observabilityResults += @{Component="OpenTelemetry"; Status="Failed"; Success=$false}
            $observabilitySuccess = $false
          }
          
          # Test Aspire Dashboard observability features
          Write-Host "`n🎛️ Testing Aspire Dashboard observability features..." -ForegroundColor Yellow
          try {
            $aspireResponse = Invoke-WebRequest -Uri "http://localhost:18888" -Method GET -TimeoutSec 10
            if ($aspireResponse.StatusCode -eq 200) {
              Write-Host "✅ Aspire Dashboard accessible with observability interface" -ForegroundColor Green
              
              # Check for observability-related content in the response
              $content = $aspireResponse.Content
              $observabilityFeatures = @("traces", "metrics", "logs", "resources", "console")
              $foundFeatures = @()
              foreach ($feature in $observabilityFeatures) {
                if ($content -match $feature) {
                  $foundFeatures += $feature
                }
              }
              
              if ($foundFeatures.Count -gt 0) {
                Write-Host "   📋 Available observability features: $($foundFeatures -join ', ')" -ForegroundColor Cyan
              }
              
              $observabilityResults += @{Component="Aspire Dashboard"; Status="Operational"; Success=$true; Features=$foundFeatures.Count}
            }
          } catch {
            Write-Host "❌ Aspire Dashboard observability test failed: $($_.Exception.Message)" -ForegroundColor Red
            $observabilityResults += @{Component="Aspire Dashboard"; Status="Failed"; Success=$false}
            $observabilitySuccess = $false
          }
          
          # Summary of observability validation
          Write-Host "`n📋 Observability Stack Validation Results:" -ForegroundColor Green
          $successfulComponents = ($observabilityResults | Where-Object { $_.Success -eq $true }).Count
          $totalComponents = $observabilityResults.Count
          
          foreach ($result in $observabilityResults) {
            $status = if ($result.Success) { "✅ OPERATIONAL" } else { "❌ FAILED" }
            Write-Host "  $($result.Component): $status - $($result.Status)" -ForegroundColor $(if ($result.Success) { "Green" } else { "Red" })
          }
          
          Write-Host "`nObservability Result: $successfulComponents/$totalComponents components operational" -ForegroundColor $(if ($observabilitySuccess) { "Green" } else { "Red" })
          
          if ($observabilitySuccess) {
            Write-Host "✅ OBSERVABILITY STACK VALIDATION COMPLETED SUCCESSFULLY!" -ForegroundColor Green
            Write-Host "📊 All monitoring and observability components are functional and ready for stress test monitoring" -ForegroundColor Cyan
          } else {
            Write-Host "⚠️ SOME OBSERVABILITY COMPONENTS HAVE ISSUES" -ForegroundColor Yellow
            Write-Host "The system is still functional, but some monitoring features may not work optimally" -ForegroundColor Yellow
          }

      - name: Validate Enhanced Temporal Architecture Integration
        timeout-minutes: 15
        run: |
          Write-Host "`n🔄 Validating Enhanced Temporal Architecture Integration..." -ForegroundColor Green
          Write-Host "Testing new enterprise-grade Temporal workflow management capabilities" -ForegroundColor Cyan
          
          $temporalApiBase = "http://localhost:5000/api/TemporalArchitectureTest"
          $temporalTestResults = @()
          $temporalSuccess = $true
          
          try {
            # Test 1: Start Intelligent Job Distribution
            Write-Host "`n📋 Test 1: Starting intelligent job distribution..." -ForegroundColor Yellow
            try {
              $jobDistributionConfig = @{
                Strategy = "BestFit"
                MessageCount = 1000
                UseAdvancedPlacement = $true
                MonitoringEnabled = $true
              }
              $distributionResponse = Invoke-RestMethod -Uri "$temporalApiBase/temporal/start-job-distribution" -Method POST -Body ($jobDistributionConfig | ConvertTo-Json) -ContentType "application/json" -TimeoutSec 60
              Write-Host "✅ Temporal job distribution started: $($distributionResponse.Status)" -ForegroundColor Green
              Write-Host "   Workflow ID: $($distributionResponse.WorkflowId)" -ForegroundColor Cyan
              Write-Host "   Strategy: $($distributionResponse.Strategy)" -ForegroundColor Cyan
              $workflowId = $distributionResponse.WorkflowId
              $temporalTestResults += @{Test="Job_Distribution"; Status=$distributionResponse.Status; Success=$true}
            } catch {
              Write-Host "❌ Temporal job distribution failed: $($_.Exception.Message)" -ForegroundColor Red
              $temporalTestResults += @{Test="Job_Distribution"; Status="Failed"; Success=$false}
              $temporalSuccess = $false
            }
            
            # Test 2: Monitor Workflow Status
            if ($workflowId) {
              Write-Host "`n📊 Test 2: Monitoring workflow status..." -ForegroundColor Yellow
              try {
                $statusResponse = Invoke-RestMethod -Uri "$temporalApiBase/temporal/workflow-status/$workflowId" -Method GET -TimeoutSec 30
                Write-Host "✅ Workflow status retrieved: $($statusResponse.Status)" -ForegroundColor Green
                Write-Host "   Execution State: $($statusResponse.ExecutionState)" -ForegroundColor Cyan
                Write-Host "   Progress: $($statusResponse.Progress)" -ForegroundColor Cyan
                $temporalTestResults += @{Test="Workflow_Status"; Status=$statusResponse.Status; Success=$true}
              } catch {
                Write-Host "❌ Workflow status monitoring failed: $($_.Exception.Message)" -ForegroundColor Red
                $temporalTestResults += @{Test="Workflow_Status"; Status="Failed"; Success=$false}
                $temporalSuccess = $false
              }
            }
            
            # Test 3: Test Orchestra Job Submission
            Write-Host "`n🎼 Test 3: Testing FlinkDotNet.Orchestration job submission..." -ForegroundColor Yellow
            try {
              $orchestraConfig = @{
                Strategy = "LeastLoaded"
                JobName = "LocalTesting Enterprise Job"
                CpuCores = 2
                MemoryMB = 1024
                Priority = "Normal"
              }
              $orchestraResponse = Invoke-RestMethod -Uri "$temporalApiBase/orchestra/submit-job" -Method POST -Body ($orchestraConfig | ConvertTo-Json) -ContentType "application/json" -TimeoutSec 60
              Write-Host "✅ Orchestra job submitted: $($orchestraResponse.Status)" -ForegroundColor Green
              Write-Host "   Job ID: $($orchestraResponse.JobId)" -ForegroundColor Cyan
              Write-Host "   Cluster: $($orchestraResponse.AssignedCluster)" -ForegroundColor Cyan
              $temporalTestResults += @{Test="Orchestra_Job"; Status=$orchestraResponse.Status; Success=$true}
            } catch {
              Write-Host "❌ Orchestra job submission failed: $($_.Exception.Message)" -ForegroundColor Red
              $temporalTestResults += @{Test="Orchestra_Job"; Status="Failed"; Success=$false}
              $temporalSuccess = $false
            }
            
            # Test 4: Check Cluster Health
            Write-Host "`n🏥 Test 4: Checking cluster health..." -ForegroundColor Yellow
            try {
              $healthResponse = Invoke-RestMethod -Uri "$temporalApiBase/orchestra/health" -Method GET -TimeoutSec 30
              Write-Host "✅ Cluster health checked: $($healthResponse.Status)" -ForegroundColor Green
              Write-Host "   Healthy Clusters: $($healthResponse.HealthyClusters)" -ForegroundColor Cyan
              Write-Host "   Total Clusters: $($healthResponse.TotalClusters)" -ForegroundColor Cyan
              $temporalTestResults += @{Test="Cluster_Health"; Status=$healthResponse.Status; Success=$true}
            } catch {
              Write-Host "❌ Cluster health check failed: $($_.Exception.Message)" -ForegroundColor Red
              $temporalTestResults += @{Test="Cluster_Health"; Status="Failed"; Success=$false}
              $temporalSuccess = $false
            }
            
            # Test 5: Test Circuit Breaker Resilience
            Write-Host "`n🔄 Test 5: Testing resilience patterns..." -ForegroundColor Yellow
            try {
              $resilienceConfig = @{
                FailureRate = 0.1
                CircuitBreakerThreshold = 5
                TestDurationSeconds = 10
              }
              $resilienceResponse = Invoke-RestMethod -Uri "$temporalApiBase/resilience/test-circuit-breaker" -Method POST -Body ($resilienceConfig | ConvertTo-Json) -ContentType "application/json" -TimeoutSec 45
              Write-Host "✅ Resilience patterns tested: $($resilienceResponse.Status)" -ForegroundColor Green
              Write-Host "   Circuit Breaker State: $($resilienceResponse.CircuitBreakerState)" -ForegroundColor Cyan
              Write-Host "   Failures Handled: $($resilienceResponse.FailuresHandled)" -ForegroundColor Cyan
              $temporalTestResults += @{Test="Resilience_Patterns"; Status=$resilienceResponse.Status; Success=$true}
            } catch {
              Write-Host "❌ Resilience patterns test failed: $($_.Exception.Message)" -ForegroundColor Red
              $temporalTestResults += @{Test="Resilience_Patterns"; Status="Failed"; Success=$false}
              $temporalSuccess = $false
            }
            
            # Test 6: Cancel Workflow (if workflow is still running)
            if ($workflowId) {
              Write-Host "`n🛑 Test 6: Testing workflow cancellation..." -ForegroundColor Yellow
              try {
                $cancelConfig = @{
                  Reason = "LocalTesting workflow validation complete"
                  GracefulShutdown = $true
                }
                $cancelResponse = Invoke-RestMethod -Uri "$temporalApiBase/temporal/cancel-workflow/$workflowId" -Method POST -Body ($cancelConfig | ConvertTo-Json) -ContentType "application/json" -TimeoutSec 30
                Write-Host "✅ Workflow cancelled: $($cancelResponse.Status)" -ForegroundColor Green
                Write-Host "   Cancellation Reason: $($cancelResponse.Reason)" -ForegroundColor Cyan
                $temporalTestResults += @{Test="Workflow_Cancellation"; Status=$cancelResponse.Status; Success=$true}
              } catch {
                Write-Host "❌ Workflow cancellation failed: $($_.Exception.Message)" -ForegroundColor Red
                $temporalTestResults += @{Test="Workflow_Cancellation"; Status="Failed"; Success=$false}
                $temporalSuccess = $false
              }
            }
            
          } catch {
            Write-Host "❌ Temporal architecture test failed: $($_.Exception.Message)" -ForegroundColor Red
            $temporalTestResults += @{Test="Error"; Status="Failed"; Success=$false; Error=$_.Exception.Message}
            $temporalSuccess = $false
          }
          
          # Summary Report
          Write-Host "`n📋 Enhanced Temporal Architecture Test Results:" -ForegroundColor Green
          
          $successfulTests = ($temporalTestResults | Where-Object { $_.Success -eq $true }).Count
          $totalTests = $temporalTestResults.Count
          
          foreach ($result in $temporalTestResults) {
            $status = if ($result.Success) { "✅ PASSED" } else { "❌ FAILED" }
            Write-Host "  $($result.Test): $status - $($result.Status)" -ForegroundColor $(if ($result.Success) { "Green" } else { "Red" })
          }
          
          Write-Host "Temporal Architecture Result: $successfulTests/$totalTests tests passed" -ForegroundColor $(if ($temporalSuccess) { "Green" } else { "Red" })
          
          if ($temporalSuccess) {
            Write-Host "🎉 ENHANCED TEMPORAL ARCHITECTURE VALIDATION SUCCESSFUL!" -ForegroundColor Green
            Write-Host "All new enterprise-grade Temporal workflow management features are working correctly" -ForegroundColor Cyan
          } else {
            Write-Host "❌ SOME TEMPORAL ARCHITECTURE FEATURES FAILED" -ForegroundColor Red
            Write-Host "⚠️ Note: This may be expected if Temporal services are still starting up" -ForegroundColor Yellow
          }

      - name: Execute Complex Logic Stress Test Business Flows
        timeout-minutes: 20
        run: |
          Write-Host "`n🧪 Executing Complex Logic Stress Test Business Flows..." -ForegroundColor Green
          Write-Host "This validates the actual business functionality rather than just container startup" -ForegroundColor Cyan
          Write-Host "🔍 Monitoring message flow and observability during stress test execution" -ForegroundColor Yellow
          
          $apiBase = "http://localhost:5000/api/ComplexLogicStressTest"
          $testResults = @()
          $overallSuccess = $true
          $observabilityMonitoring = @()
          
          # Function to capture observability metrics during test execution
          function Capture-ObservabilityMetrics {
            param([string]$StepName, [string]$TestId = "")
            
            $metrics = @{
              Step = $StepName
              Timestamp = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
              TestId = $TestId
            }
            
            # Capture Prometheus metrics
            try {
              $upQuery = Invoke-RestMethod -Uri "http://localhost:9090/api/v1/query?query=up" -Method GET -TimeoutSec 3 -ErrorAction SilentlyContinue
              $metrics.ServiceUpCount = ($upQuery.data.result | Where-Object { $_.value[1] -eq "1" }).Count
              $metrics.ServiceTotalCount = $upQuery.data.result.Count
            } catch {
              $metrics.ServiceUpCount = "N/A"
              $metrics.ServiceTotalCount = "N/A"
            }
            
            # Capture message flow metrics (if available)
            try {
              $httpRequests = Invoke-RestMethod -Uri "http://localhost:9090/api/v1/query?query=http_requests_total" -Method GET -TimeoutSec 3 -ErrorAction SilentlyContinue
              $metrics.HttpRequestsTotal = ($httpRequests.data.result | Measure-Object -Property @{Expression={[double]$_.value[1]}} -Sum).Sum
            } catch {
              $metrics.HttpRequestsTotal = "N/A"
            }
            
            # Capture Kafka metrics (if available)
            try {
              $kafkaQuery = Invoke-RestMethod -Uri "http://localhost:9090/api/v1/query?query=kafka_producer_messages_sent_total" -Method GET -TimeoutSec 3 -ErrorAction SilentlyContinue
              if ($kafkaQuery.data.result.Count -gt 0) {
                $metrics.KafkaMessagesSent = ($kafkaQuery.data.result | Measure-Object -Property @{Expression={[double]$_.value[1]}} -Sum).Sum
              } else {
                $metrics.KafkaMessagesSent = "No data"
              }
            } catch {
              $metrics.KafkaMessagesSent = "N/A"
            }
            
            return $metrics
          }
          
          # Capture initial observability state
          Write-Host "📊 Capturing initial observability baseline..." -ForegroundColor Cyan
          $initialMetrics = Capture-ObservabilityMetrics -StepName "Initial Baseline"
          $observabilityMonitoring += $initialMetrics
          Write-Host "   Services Up: $($initialMetrics.ServiceUpCount)/$($initialMetrics.ServiceTotalCount)" -ForegroundColor Green
          
          try {
            # CORRECT 8-STEP BUSINESS FLOW
            
            # Step 1: Configure Backpressure (100 msg/sec per logical queue)
            Write-Host "`n⚡ Step 1: Configuring backpressure (100 msg/sec per logical queue)..." -ForegroundColor Yellow
            try {
              $backpressureConfig = @{
                PartitionCount = 100
                LogicalQueueCount = 1000
                MessagesPerSecondPerQueue = 100.0
              }
              $backpressureResponse = Invoke-RestMethod -Uri "$apiBase/step1/configure-backpressure" -Method POST -Body ($backpressureConfig | ConvertTo-Json) -ContentType "application/json" -TimeoutSec 30
              Write-Host "✅ Step 1: Backpressure configuration: $($backpressureResponse.Status)" -ForegroundColor Green
              Write-Host "   $($backpressureResponse.Rate)" -ForegroundColor Cyan
              $testResults += @{Step="1-Backpressure"; Status=$backpressureResponse.Status; Success=$true}
              
              # Capture observability metrics after backpressure configuration
              $step1Metrics = Capture-ObservabilityMetrics -StepName "Step 1 - Backpressure Config"
              $observabilityMonitoring += $step1Metrics
              Write-Host "   📊 Observability: Services Up: $($step1Metrics.ServiceUpCount)/$($step1Metrics.ServiceTotalCount)" -ForegroundColor Cyan
            } catch {
              Write-Host "❌ Step 1 failed: $($_.Exception.Message)" -ForegroundColor Red
              $testResults += @{Step="1-Backpressure"; Status="Failed"; Success=$false}
              $overallSuccess = $false
            }
            
            # Step 2: Temporal Job Submission for 1M Messages (with top 1 and last 1 display)
            Write-Host "`n📝 Step 2: Temporal job submission for 1M messages..." -ForegroundColor Yellow
