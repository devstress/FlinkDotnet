              $messageConfig = @{
                MessageCount = 10000  # 10K for CI testing
                UseTemporalSubmission = $true
                PartitionCount = 100
                LogicalQueueCount = 1000
              }
              $productionResponse = Invoke-RestMethod -Uri "$apiBase/step2/temporal-submit-messages" -Method POST -Body ($messageConfig | ConvertTo-Json) -ContentType "application/json" -TimeoutSec 120
              Write-Host "✅ Step 2: Submitted Job for producing 1 million Messages: $($productionResponse.Status)" -ForegroundColor Green
              Write-Host "   Messages: $($productionResponse.Messages)" -ForegroundColor Cyan
              Write-Host "   ($($productionResponse.BackpressureEffect))" -ForegroundColor Yellow
              
              # Display top 1 and last 1 message details as required
              if ($productionResponse.TopMessageSample) {
                Write-Host "   📋 Top 1 Message Details:" -ForegroundColor Yellow
                Write-Host "      Message ID: $($productionResponse.TopMessageSample.MessageID)" -ForegroundColor Cyan
                Write-Host "      Content: $($productionResponse.TopMessageSample.Content)" -ForegroundColor Cyan
                Write-Host "      Headers: $($productionResponse.TopMessageSample.Headers)" -ForegroundColor Cyan
              }
              
