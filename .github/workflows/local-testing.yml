            } catch {
              Write-Host "❌ Step 5 failed: $($_.Exception.Message)" -ForegroundColor Red
              $testResults += @{Step="5-Kafka_InSink"; Status="Failed"; Success=$false}
              $overallSuccess = $false
            }
            
            # Step 6: Flink Job - Split Messages
            Write-Host "`n✂️ Step 6: Flink job to split messages and add sending ID + logical queue name..." -ForegroundColor Yellow
            try {
              $splitConfig = @{
                InputTopic = "api-retrieved-messages"
                OutputTopic = "sample_response"
                AddSendingId = $true
                AddLogicalQueueName = $true
                UseCorrelationMatching = $true
              }
              $splitResponse = Invoke-RestMethod -Uri "$apiBase/step6/flink-split-job" -Method POST -Body ($splitConfig | ConvertTo-Json) -ContentType "application/json" -TimeoutSec 120
              Write-Host "✅ Step 6: Flink split job: $($splitResponse.Status)" -ForegroundColor Green
              Write-Host "   Job ID: $($splitResponse.JobId)" -ForegroundColor Cyan
              
              # Display split message details
              if ($splitResponse.TopSplitMessageSample) {
                Write-Host "   📋 Top 1 Split Message Details:" -ForegroundColor Yellow
                Write-Host "      Message ID: $($splitResponse.TopSplitMessageSample.MessageID)" -ForegroundColor Cyan
                Write-Host "      Content: $($splitResponse.TopSplitMessageSample.Content)" -ForegroundColor Cyan
                Write-Host "      Headers: $($splitResponse.TopSplitMessageSample.Headers)" -ForegroundColor Cyan
              }
              
              if ($splitResponse.LastSplitMessageSample) {
                Write-Host "   📋 Last 1 Split Message Details:" -ForegroundColor Yellow
                Write-Host "      Message ID: $($splitResponse.LastSplitMessageSample.MessageID)" -ForegroundColor Cyan
                Write-Host "      Content: $($splitResponse.LastSplitMessageSample.Content)" -ForegroundColor Cyan
                Write-Host "      Headers: $($splitResponse.LastSplitMessageSample.Headers)" -ForegroundColor Cyan
              }
              $testResults += @{Step="6-Flink_Split"; Status=$splitResponse.Status; Success=$true}
              
              # Capture observability metrics for Day12 advanced streaming patterns
              $step6Metrics = Capture-ObservabilityMetrics -StepName "Step 6 - Flink Split" -LearningModule "Day12-Advanced-Streaming-Patterns"
              $observabilityMonitoring += $step6Metrics
              Write-Host "   📊 Pattern matching: Matches: $($step6Metrics.PatternMatches), Complex Events: $($step6Metrics.ComplexEvents)" -ForegroundColor Cyan
            } catch {
              Write-Host "❌ Step 6 failed: $($_.Exception.Message)" -ForegroundColor Red
              $testResults += @{Step="6-Flink_Split"; Status="Failed"; Success=$false}
              $overallSuccess = $false
            }
            
            # Step 7: Write to sample_response Topic
            Write-Host "`n📤 Step 7: Write messages to sample_response topic..." -ForegroundColor Yellow
            try {
              $writeConfig = @{
                TargetTopic = "sample_response"
                TopMessageCount = 10
                LastMessageCount = 10
              }
              $writeResponse = Invoke-RestMethod -Uri "$apiBase/step7/write-to-sample-response" -Method POST -Body ($writeConfig | ConvertTo-Json) -ContentType "application/json" -TimeoutSec 120
              Write-Host "✅ Step 7: Write to sample_response: $($writeResponse.Status)" -ForegroundColor Green
              Write-Host "   Written messages: $($writeResponse.WrittenMessages.ToString('N0'))" -ForegroundColor Cyan
              
              # Display written message details
              if ($writeResponse.TopWrittenMessageSample) {
                Write-Host "   📋 Top 1 Written Message Details:" -ForegroundColor Yellow
                Write-Host "      Message ID: $($writeResponse.TopWrittenMessageSample.MessageID)" -ForegroundColor Cyan
                Write-Host "      Content: $($writeResponse.TopWrittenMessageSample.Content)" -ForegroundColor Cyan
                Write-Host "      Headers: $($writeResponse.TopWrittenMessageSample.Headers)" -ForegroundColor Cyan
              }
              
              if ($writeResponse.LastWrittenMessageSample) {
                Write-Host "   📋 Last 1 Written Message Details:" -ForegroundColor Yellow
                Write-Host "      Message ID: $($writeResponse.LastWrittenMessageSample.MessageID)" -ForegroundColor Cyan
                Write-Host "      Content: $($writeResponse.LastWrittenMessageSample.Content)" -ForegroundColor Cyan
                Write-Host "      Headers: $($writeResponse.LastWrittenMessageSample.Headers)" -ForegroundColor Cyan
              }
              $testResults += @{Step="7-Write_SampleResponse"; Status=$writeResponse.Status; Success=$true}
              
              # Capture observability metrics for Day07 stress testing
              $step7Metrics = Capture-ObservabilityMetrics -StepName "Step 7 - Write Sample Response" -LearningModule "Day07-Stress-Testing"
              $observabilityMonitoring += $step7Metrics
              Write-Host "   📊 Stress test monitoring: Events: $($step7Metrics.StressTestEvents), Error Rate: $($step7Metrics.StressTestErrorRate)" -ForegroundColor Cyan
            } catch {
              Write-Host "❌ Step 7 failed: $($_.Exception.Message)" -ForegroundColor Red
              $testResults += @{Step="7-Write_SampleResponse"; Status="Failed"; Success=$false}
              $overallSuccess = $false
            }
            
            # Step 8: Verify Top 10 and Last 10 Messages
            Write-Host "`n🔍 Step 8: Verifying top 10 and last 10 messages from sample_response topic..." -ForegroundColor Yellow
            try {
              $verificationConfig = @{
                TargetTopic = "sample_response"
                TopCount = 10
                LastCount = 10
                VerifyHeaders = $true
                VerifyContent = $true
              }
              $verificationResponse = Invoke-RestMethod -Uri "$apiBase/step8/verify-messages" -Method POST -Body ($verificationConfig | ConvertTo-Json) -ContentType "application/json" -TimeoutSec 120
              Write-Host "✅ Step 8: Message verification: $($verificationResponse.Status)" -ForegroundColor Green
              Write-Host "   Success Rate: $($verificationResponse.VerificationResult.SuccessRate.ToString('P1'))" -ForegroundColor Cyan
              
              # Display top 1 and last 1 message details as requested
              Write-Host "   📋 Message Verification Details:" -ForegroundColor Yellow
              
              if ($verificationResponse.TopMessageSample) {
                Write-Host "      🔝 Top 1 Message Details:" -ForegroundColor Green
                Write-Host "         Message ID: $($verificationResponse.TopMessageSample.MessageID)" -ForegroundColor Cyan
                Write-Host "         Content: $($verificationResponse.TopMessageSample.Content)" -ForegroundColor Cyan
                Write-Host "         Headers: $($verificationResponse.TopMessageSample.Headers)" -ForegroundColor Cyan
              }
              
              if ($verificationResponse.LastMessageSample) {
                Write-Host "      🔚 Last 1 Message Details:" -ForegroundColor Green  
                Write-Host "         Message ID: $($verificationResponse.LastMessageSample.MessageID)" -ForegroundColor Cyan
                Write-Host "         Content: $($verificationResponse.LastMessageSample.Content)" -ForegroundColor Cyan
                Write-Host "         Headers: $($verificationResponse.LastMessageSample.Headers)" -ForegroundColor Cyan
              }
              
              $testResults += @{Step="8-Verify_Messages"; Status=$verificationResponse.Status; Success=$true}
              
              # Capture observability metrics for Day08 exactly-once semantics
              $step8Metrics = Capture-ObservabilityMetrics -StepName "Step 8 - Verify Messages" -LearningModule "Day08-Exactly-Once-Semantics"
              $observabilityMonitoring += $step8Metrics
              Write-Host "   📊 Exactly-once monitoring: Duplicates: $($step8Metrics.DuplicatesDetected), Checkpoint Duration: $($step8Metrics.CheckpointDuration)ms" -ForegroundColor Cyan
            } catch {
              Write-Host "❌ Step 8 failed: $($_.Exception.Message)" -ForegroundColor Red
              $testResults += @{Step="8-Verify_Messages"; Status="Failed"; Success=$false}
              $overallSuccess = $false
            }
            
            # Comprehensive Observability Monitoring Summary with ALL 14 LearningCourse Modules
            Write-Host "`n📊 COMPREHENSIVE 14-MODULE LEARNINGCOURSE OBSERVABILITY SUMMARY:" -ForegroundColor Green
            Write-Host "Supporting all 14 Learning Course modules with comprehensive real-time monitoring" -ForegroundColor Cyan
            Write-Host "=" * 90 -ForegroundColor Green
            
            # Capture final observability metrics for Day14 capstone project
            $finalMetrics = Capture-ObservabilityMetrics -StepName "Final State - All Steps Complete" -LearningModule "Day14-Capstone-Project"
            $observabilityMonitoring += $finalMetrics
            
            # Display comprehensive observability data for all modules
            foreach ($monitoring in $observabilityMonitoring) {
              Write-Host "🕐 $($monitoring.Timestamp) - $($monitoring.Step):" -ForegroundColor Yellow
              if ($monitoring.LearningModule) {
                Write-Host "   📚 Learning Module: $($monitoring.LearningModule)" -ForegroundColor Magenta
                
                # Display module-specific metrics based on the learning module
                switch ($monitoring.LearningModule) {
                  "Day01-Flink21-Fundamentals" {
                    if ($monitoring.FlinkRunningJobs -ne "N/A") {
                      Write-Host "   ⚡ Flink Running Jobs: $($monitoring.FlinkRunningJobs)" -ForegroundColor Green
                    }
                    if ($monitoring.FlinkHeapMemory -ne "N/A") {
                      Write-Host "   🧠 Flink Heap Memory: $($monitoring.FlinkHeapMemory) MB" -ForegroundColor Green
                    }
                  }
                  "Day02-AI-Stream-Processing" {
                    if ($monitoring.AIInferenceRequests -ne "N/A") {
                      Write-Host "   🤖 AI Inference Requests: $($monitoring.AIInferenceRequests)" -ForegroundColor Green
                    }
                    if ($monitoring.AIInferenceLatency -ne "N/A") {
                      Write-Host "   ⏱️ AI Inference Latency: $($monitoring.AIInferenceLatency) ms" -ForegroundColor Green
                    }
                  }
                  "Day03-Production-Backpressure" {
                    if ($monitoring.ConsumerLag -ne "N/A") {
                      Write-Host "   📈 Consumer Lag: $($monitoring.ConsumerLag) messages" -ForegroundColor Green
                    }
                    if ($monitoring.MessageThroughput -ne "N/A") {
                      Write-Host "   🚀 Message Throughput: $($monitoring.MessageThroughput) msg/sec" -ForegroundColor Green
                    }
                  }
                  "Day04-Enterprise-Observability" {
                    if ($monitoring.PrometheusTargetsUp -ne "N/A") {
                      Write-Host "   🎯 Prometheus Targets: $($monitoring.PrometheusTargetsUp)/$($monitoring.PrometheusTargetsTotal) up" -ForegroundColor Green
                    }
                    if ($monitoring.MetricsSamples -ne "N/A") {
                      Write-Host "   📊 Metrics Samples: $($monitoring.MetricsSamples)" -ForegroundColor Green
                    }
                  }
                  "Day05-Temporal-Workflows" {
                    if ($monitoring.TemporalWorkflows -ne "N/A") {
                      Write-Host "   🔄 Temporal Workflows: $($monitoring.TemporalWorkflows)" -ForegroundColor Green
                    }
                    if ($monitoring.TemporalActivities -ne "N/A") {
                      Write-Host "   ⚙️ Temporal Activities: $($monitoring.TemporalActivities)" -ForegroundColor Green
                    }
                  }
                  "Day06-Advanced-Windows-Joins" {
                    if ($monitoring.WindowOperations -ne "N/A") {
                      Write-Host "   🪟 Window Operations: $($monitoring.WindowOperations)" -ForegroundColor Green
                    }
                    if ($monitoring.WindowWatermarks -ne "N/A") {
                      Write-Host "   💧 Window Watermarks: $($monitoring.WindowWatermarks)" -ForegroundColor Green
                    }
                  }
                  "Day07-Stress-Testing" {
                    if ($monitoring.StressTestEvents -ne "N/A") {
                      Write-Host "   💪 Stress Test Events: $($monitoring.StressTestEvents)" -ForegroundColor Green
                    }
                    if ($monitoring.StressTestErrorRate -ne "N/A") {
                      Write-Host "   ❗ Stress Test Error Rate: $($monitoring.StressTestErrorRate)" -ForegroundColor Green
                    }
                  }
                  "Day08-Exactly-Once-Semantics" {
                    if ($monitoring.DuplicatesDetected -ne "N/A") {
                      Write-Host "   🔍 Duplicates Detected: $($monitoring.DuplicatesDetected)" -ForegroundColor Green
                    }
                    if ($monitoring.CheckpointDuration -ne "N/A") {
                      Write-Host "   ⏰ Checkpoint Duration: $($monitoring.CheckpointDuration) ms" -ForegroundColor Green
                    }
                  }
                  "Day09-Performance-Optimization-Scaling" {
                    if ($monitoring.CPUUsage -ne "N/A") {
                      Write-Host "   💻 CPU Usage: $($monitoring.CPUUsage)" -ForegroundColor Green
                    }
                    if ($monitoring.FlinkParallelism -ne "N/A") {
                      Write-Host "   ⚡ Flink Parallelism: $($monitoring.FlinkParallelism)" -ForegroundColor Green
                    }
                  }
                  "Day10-Security-Privacy-Compliance" {
                    if ($monitoring.SecurityEvents -ne "N/A") {
                      Write-Host "   🔐 Security Events: $($monitoring.SecurityEvents)" -ForegroundColor Green
                    }
                    if ($monitoring.AuthFailures -ne "N/A") {
                      Write-Host "   🚫 Auth Failures: $($monitoring.AuthFailures)" -ForegroundColor Green
                    }
                  }
                  "Day11-Disaster-Recovery-Multi-Region" {
                    if ($monitoring.ReplicationLag -ne "N/A") {
                      Write-Host "   🔄 Replication Lag: $($monitoring.ReplicationLag) messages" -ForegroundColor Green
                    }
                    if ($monitoring.DREvents -ne "N/A") {
                      Write-Host "   🆘 DR Events: $($monitoring.DREvents)" -ForegroundColor Green
                    }
                  }
                  "Day12-Advanced-Streaming-Patterns" {
                    if ($monitoring.PatternMatches -ne "N/A") {
                      Write-Host "   🎯 Pattern Matches: $($monitoring.PatternMatches)" -ForegroundColor Green
                    }
                    if ($monitoring.ComplexEvents -ne "N/A") {
                      Write-Host "   🌟 Complex Events: $($monitoring.ComplexEvents)" -ForegroundColor Green
                    }
                  }
                  "Day13-Advanced-Testing-Chaos-Engineering" {
                    if ($monitoring.ChaosExperiments -ne "N/A") {
                      Write-Host "   💥 Chaos Experiments: $($monitoring.ChaosExperiments)" -ForegroundColor Green
                    }
                    if ($monitoring.ResilienceScore -ne "N/A") {
                      Write-Host "   🛡️ Resilience Score: $($monitoring.ResilienceScore)" -ForegroundColor Green
                    }
                  }
                  "Day14-Capstone-Project" {
                    if ($monitoring.ProjectCompletion -ne "N/A") {
                      Write-Host "   🎓 Project Completion: $($monitoring.ProjectCompletion)%" -ForegroundColor Green
                    }
                    if ($monitoring.IntegrationTestsPassed -ne "N/A") {
                      Write-Host "   ✅ Integration Tests Passed: $($monitoring.IntegrationTestsPassed)" -ForegroundColor Green
                    }
                  }
                }
              }
              
              # Core metrics displayed for all modules
              Write-Host "   🔧 Services: $($monitoring.ServiceUpCount)/$($monitoring.ServiceTotalCount) up" -ForegroundColor Green
              if ($monitoring.HttpRequestsTotal -ne "N/A") {
                Write-Host "   🌐 HTTP Requests: $($monitoring.HttpRequestsTotal)" -ForegroundColor Green
              }
              if ($monitoring.KafkaMessagesSent -ne "N/A" -and $monitoring.KafkaMessagesSent -ne "No data") {
                Write-Host "   📨 Kafka Messages: $($monitoring.KafkaMessagesSent)" -ForegroundColor Green
              }
              if ($monitoring.MessageProcessingRate -ne "N/A") {
                Write-Host "   ⚡ Processing Rate: $($monitoring.MessageProcessingRate) msg/sec" -ForegroundColor Green
              }
              if ($monitoring.TestId) {
                Write-Host "   🆔 Test ID: $($monitoring.TestId)" -ForegroundColor Gray
              }
              Write-Host ""
            }
            
            # Calculate observability metrics changes for LearningCourse validation
            if ($observabilityMonitoring.Count -ge 2) {
              $initialState = $observabilityMonitoring[0]
              $finalState = $observabilityMonitoring[-1]
              
              Write-Host "📈 LEARNINGCOURSE OBSERVABILITY DELTA ANALYSIS:" -ForegroundColor Green
              
              # Service stability check across all modules
              if ($initialState.ServiceUpCount -eq $finalState.ServiceUpCount) {
                Write-Host "✅ Service Stability: All services remained stable throughout test ($($finalState.ServiceUpCount)/$($finalState.ServiceTotalCount))" -ForegroundColor Green
              } else {
                Write-Host "⚠️ Service Changes: $($initialState.ServiceUpCount) → $($finalState.ServiceUpCount) services up" -ForegroundColor Yellow
              }
              
              # Message flow analysis for all LearningCourse modules
              if ($finalState.HttpRequestsTotal -ne "N/A" -and $initialState.HttpRequestsTotal -ne "N/A") {
                try {
                  $httpDelta = [double]$finalState.HttpRequestsTotal - [double]$initialState.HttpRequestsTotal
                  if ($httpDelta -gt 0) {
                    Write-Host "✅ HTTP Activity: +$httpDelta requests during LearningCourse test execution" -ForegroundColor Green
                  }
                } catch {
                  Write-Host "📊 HTTP Activity: Detected during test execution" -ForegroundColor Yellow
                }
              }
              
              # Kafka message processing for streaming modules
              if ($finalState.KafkaMessagesSent -ne "N/A" -and $finalState.KafkaMessagesSent -ne "No data" -and 
                  $initialState.KafkaMessagesSent -ne "N/A" -and $initialState.KafkaMessagesSent -ne "No data") {
                try {
                  $kafkaDelta = [double]$finalState.KafkaMessagesSent - [double]$initialState.KafkaMessagesSent
                  if ($kafkaDelta -gt 0) {
                    Write-Host "✅ Kafka Message Flow: +$kafkaDelta messages processed during test" -ForegroundColor Green
                    
                    # Calculate overall processing rate
                    $testDuration = (Get-Date $finalState.Timestamp) - (Get-Date $initialState.Timestamp)
                    if ($testDuration.TotalSeconds -gt 0) {
                      $overallRate = [math]::Round($kafkaDelta / $testDuration.TotalSeconds, 2)
                      Write-Host "✅ Overall Processing Rate: $overallRate msg/sec across all LearningCourse modules" -ForegroundColor Green
                    }
                  }
                } catch {
                  Write-Host "📊 Kafka Message Activity: Detected during test execution" -ForegroundColor Yellow
                }
              }
              
              Write-Host "🎯 LearningCourse Observability Validation: COMPREHENSIVE MONITORING SUCCESSFUL" -ForegroundColor Green
              Write-Host "📚 All 14 Learning Course modules now have enhanced observability support!" -ForegroundColor Cyan
            }
            
          }
          catch {
            Write-Host "❌ Business flow test failed: $($_.Exception.Message)" -ForegroundColor Red
            Write-Host "Response details: $($_.Exception.Response | Out-String)" -ForegroundColor Yellow
            $testResults += @{Step="Error"; Status="Failed"; Success=$false; Error=$_.Exception.Message}
            $overallSuccess = $false
          }
          
          # Summary Report
          Write-Host "`n📋 Complex Logic Stress Test Business Flow Results:" -ForegroundColor Green
          
          $successfulSteps = ($testResults | Where-Object { $_.Success -eq $true }).Count
          $totalSteps = $testResults.Count
          
          foreach ($result in $testResults) {
            $status = if ($result.Success) { "✅ PASSED" } else { "❌ FAILED" }
            Write-Host "  $($result.Step): $status - $($result.Status)" -ForegroundColor $(if ($result.Success) { "Green" } else { "Red" })
          }
          
          Write-Host "Overall Result: $successfulSteps/$totalSteps steps passed" -ForegroundColor $(if ($overallSuccess) { "Green" } else { "Red" })
          
          if ($overallSuccess) {
            Write-Host "🎉 ALL BUSINESS FLOWS COMPLETED SUCCESSFULLY!" -ForegroundColor Green
            Write-Host "The LocalTesting environment successfully executed complex logic stress test scenarios" -ForegroundColor Cyan
          } else {
            Write-Host "❌ SOME BUSINESS FLOWS FAILED" -ForegroundColor Red
            throw "Business flow validation failed - see test results above"
          }

