# Redis Configuration for LocalTesting
# Optimized for local development and testing

# Bind to all interfaces for container networking
bind 0.0.0.0

# Set appropriate port
port 6379

# Reduce logging noise for clean test output
loglevel warning

# Memory management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistence configuration (minimal for testing)
save 60 1000
stop-writes-on-bgsave-error no

# Network timeouts
timeout 30
tcp-keepalive 60

# General settings for stability
daemonize no
databases 16

# Disable some features for cleaner testing
protected-mode no
appendonly no

# Reduce startup warnings
syslog-enabled no