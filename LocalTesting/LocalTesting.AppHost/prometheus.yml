global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'aspire-dashboard'
    static_configs:
      - targets: ['aspire-dashboard:18888']

  - job_name: 'localtesting-webapi'
    static_configs:
      - targets: ['localtesting-webapi:13001']

  - job_name: 'flink-jobmanager'
    static_configs:
      - targets: ['flink-jobmanager:8081']

  - job_name: 'kafka-broker-1'
    static_configs:
      - targets: ['kafka-broker-1:9092']

  - job_name: 'kafka-broker-2'
    static_configs:
      - targets: ['kafka-broker-2:9092']

  - job_name: 'kafka-broker-3'
    static_configs:
      - targets: ['kafka-broker-3:9092']

  - job_name: 'temporal-server'
    static_configs:
      - targets: ['temporal-server:7233']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']