global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # Add any alerting rules here if needed

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OPTIMIZED: Direct Prometheus scraping for components with native support
  # This reduces OTel Collector dependency and improves reliability
  
  # Flink JobManager - Native Prometheus metrics endpoint
  - job_name: 'flink-jobmanager'
    static_configs:
      - targets: ['flink-jobmanager:9249']
    scrape_interval: 15s
    metrics_path: /
    
  # Flink TaskManager - Native Prometheus metrics endpoint
  - job_name: 'flink-taskmanager'
    static_configs:
      - targets: ['flink-taskmanager:9250']
    scrape_interval: 15s  
    metrics_path: /

  # Temporal Server - Native Prometheus metrics endpoint
  - job_name: 'temporal-server'
    static_configs:
      - targets: ['temporal-server:8000']
    scrape_interval: 15s
    metrics_path: /metrics

  # OpenTelemetry Collector - For components without native Prometheus support
  # Now handles: .NET WebAPI, Kafka, Redis, PostgreSQL metrics + traces/logs
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 15s
    metrics_path: /metrics

  # Aspire Dashboard - For development observability
  - job_name: 'aspire-dashboard'
    static_configs:
      - targets: ['localhost:18888']
    scrape_interval: 30s
    
  # LocalTesting WebAPI - Application metrics (via OTel Collector)
  # Note: This is scraped via OTel Collector, not directly
  - job_name: 'localtesting-webapi'
    static_configs:
      - targets: ['localtesting-webapi:13001']
    scrape_interval: 15s
    metrics_path: /metrics
    # This may not expose /metrics directly yet, handled via OTel