receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  # Export metrics to Prometheus
  prometheus:
    endpoint: "0.0.0.0:8889"
    
  # Export logs to Loki
  loki:
    endpoint: "http://loki:3100/loki/api/v1/push"
    
  # Log traces for now (Tempo removed due to complexity)
  logging:
    loglevel: debug
      
  # Also send metrics to Prometheus remote write
  prometheusremotewrite:
    endpoint: "http://prometheus:9090/api/v1/write"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [logging]
      
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, prometheusremotewrite]
      
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [loki]