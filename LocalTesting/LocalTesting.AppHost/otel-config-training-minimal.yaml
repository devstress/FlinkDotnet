# Minimal OpenTelemetry Collector Configuration for LocalTesting
# Simplified configuration to ensure container stability

receivers:
  # OTLP receiver for applications
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Memory limiter for stability
  memory_limiter:
    limit_mib: 512
    check_interval: 1s

  # Batch processor for efficiency
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # Prometheus exporter for metrics
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "localtesting"

  # Debug exporter for debugging (replaces deprecated logging exporter)
  debug:
    verbosity: detailed

  # OTLP exporter for Aspire Dashboard traces
  otlp/aspire:
    endpoint: "http://host.docker.internal:4323"
    tls:
      insecure: true

service:
  pipelines:
    # Metrics pipeline
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]

    # Logs pipeline - minimal configuration
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]

    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/aspire, debug]

  extensions: []