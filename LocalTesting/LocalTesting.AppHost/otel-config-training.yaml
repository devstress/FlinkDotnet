# OpenTelemetry Collector Configuration for Training
# PGL Stack: Prometheus + Grafana + Loki + OpenTelemetry
# Comprehensive coverage: Logs, Metrics, Traces, Service Health

receivers:
  # OTLP receiver for applications
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Prometheus receiver for training metrics
  prometheus:
    config:
      scrape_configs:
        - job_name: 'otel-collector'
          scrape_interval: 15s
          static_configs:
            - targets: ['localhost:8889']

processors:
  # Memory limiter for training stability
  memory_limiter:
    limit_mib: 512

  # Batch processor for efficiency
  batch:
    timeout: 1s
    send_batch_size: 1024

  # Resource processor for service identification
  resource:
    attributes:
      - key: service.name
        action: upsert
        value: "localtesting-training"
      - key: deployment.environment
        action: upsert
        value: "training"

exporters:
  # Prometheus exporter for metrics
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "localtesting"

  # File exporter as fallback for logs (loki exporter not available)
  file/logs:
    path: "/tmp/otel-logs.json"
    format: json

  # Console exporter for training debugging
  logging:
    loglevel: info

service:
  pipelines:
    # Metrics pipeline
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch, resource]
      exporters: [prometheus, logging]

    # Logs pipeline
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [file/logs, logging]

    # Traces pipeline
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch, resource]
      exporters: [logging]

  extensions: []