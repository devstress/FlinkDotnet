# Grafana Datasources Configuration for Current Implementation
# PGL + OpenTelemetry Stack: Prometheus + Grafana + Loki + OpenTelemetry + Aspire
# Optimized for current LocalTesting infrastructure

apiVersion: 1

datasources:
  # Prometheus - Metrics and Service Health (Primary metrics source)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: 2.45.0
      cacheLevel: 'High'
      disableRecordingRules: false
      incrementalQueryOverlapWindow: 10m
      queryTimeout: 60s
      # Custom interval for better performance with high-throughput metrics
      scrapeInterval: '5s'
      # Support for localtesting_ namespace prefix
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: aspire-traces

  # Loki - Centralized Logs (All LocalTesting components)
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 5000
      # Enhanced log correlation
      derivedFields:
        - datasourceUid: prometheus
          matcherRegex: 'trace_id=(\w+)'
          name: 'TraceID'
          url: '$${__value.raw}'
        - datasourceUid: prometheus
          matcherRegex: 'localtesting_([a-z_]+)'
          name: 'Metrics'
          url: '/explore?datasource=prometheus&queries=[{"expr":"${__value.text}","refId":"A"}]'

  # Aspire Dashboard - OpenTelemetry Traces and Application Insights
  - name: Aspire-Traces
    type: jaeger
    access: proxy
    url: http://host.docker.internal:18888
    editable: true
    jsonData:
      # Correlation with logs and metrics
      tracesToLogsV2:
        datasourceUid: loki
        tags: ['service.name', 'service.namespace', 'localtesting.component']
        mappedTags:
          - key: 'service.name'
            value: 'service_name'
          - key: 'localtesting.component'
            value: 'component'
        mapTagNamesEnabled: true
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
      tracesToMetrics:
        datasourceUid: prometheus
        tags: [{ key: 'service.name', value: 'service' }, { key: 'localtesting.component', value: 'component' }]
        queries:
          - name: 'LocalTesting Metrics'
            query: 'sum(rate(localtesting_${component}_${service}_total[5m]))'
          - name: 'Message Rate'  
            query: 'sum(rate(localtesting_kafka_producer_messages_total[5m]))'
        spanStartTimeShift: '-1h'
        spanEndTimeShift: '1h'
      nodeGraph:
        enabled: true
      search:
        hide: false
      spanBar:
        type: 'Tag'
        tag: 'localtesting.operation'

  # OpenTelemetry Metrics (Alternative access via OTLP)
  - name: OTLP-Metrics
    type: prometheus
    access: proxy
    url: http://otel-collector:8889
    editable: true
    jsonData:
      httpMethod: GET
      # Specifically for OpenTelemetry collector metrics endpoint
      customQueryParameters: 'match[]=localtesting_*'

deleteDatasources:
  - name: TestData DB
    orgId: 1