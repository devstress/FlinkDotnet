apiVersion: 1

datasources:
  # Prometheus for metrics
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  # Loki for logs
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  # Tempo for distributed tracing (part of LGTM stack)
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: 'prometheus'

  # Mimir for long-term metrics storage (part of LGTM stack)
  - name: Mimir
    type: prometheus
    access: proxy
    url: http://mimir:9009
    editable: true
    jsonData:
      httpMethod: POST