# Minimal OpenTelemetry Collector Configuration
# Simple, reliable configuration for basic observability

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    limit_mib: 512
    check_interval: 1s
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "localtesting"
  
  debug:
    verbosity: basic

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    
    traces:
      receivers: [otlp] 
      processors: [memory_limiter, batch]
      exporters: [debug]
      
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch] 
      exporters: [debug]