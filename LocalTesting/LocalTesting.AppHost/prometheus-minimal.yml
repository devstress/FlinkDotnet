global:
  scrape_interval: 15s  # BACKPRESSURE-OPTIMIZED: Faster scraping for MetricsRecording progress (60s -> 15s)
  evaluation_interval: 15s
  external_labels:
    monitor: 'backpressure-optimized'

scrape_configs:
  # Only essential metrics for basic functionality
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    scrape_interval: 30s

  # LocalTesting WebAPI - Critical for observability test MetricsRecording progress
  - job_name: 'localtesting-webapi'
    static_configs:
      - targets: ['localtesting-webapi:13001']
    metrics_path: '/metrics'
    scrape_interval: 5s  # BACKPRESSURE-OPTIMIZED: Fast scraping for immediate metrics availability (30s -> 5s)