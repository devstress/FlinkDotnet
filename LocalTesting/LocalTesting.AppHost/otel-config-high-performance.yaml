# High-Performance OpenTelemetry Collector Configuration
# Optimized for thousands msg/sec with local buffering and async backend forwarding
# Pattern: App → local OTel Collector (localhost gRPC/HTTP) → backend

receivers:
  # Primary OTLP receiver for WebAPI telemetry (high-performance)
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        # High-performance settings for thousands msg/sec
        max_recv_msg_size: 16777216  # 16MB for large message batches
        max_concurrent_streams: 1000  # Handle high concurrency
        keepalive:
          server_parameters:
            max_connection_idle: 60s
            time: 30s
            timeout: 5s
      http:
        endpoint: 0.0.0.0:4318
        # HTTP performance optimizations
        max_request_body_size: 33554432  # 32MB for large batches
        read_timeout: 10s
        write_timeout: 10s

processors:
  # Memory limiter with higher capacity for buffering
  memory_limiter:
    limit_mib: 1024  # Increased from 512MB for high-volume buffering
    check_interval: 5s
    spike_limit_mib: 256

  # High-performance batch processor for local buffering
  batch/high_performance:
    timeout: 100ms          # Very fast local batching (100ms)
    send_batch_size: 2048   # Large batches for efficiency
    send_batch_max_size: 4096

  # Backend batch processor for forwarding to observability stack
  batch/backend:
    timeout: 5s             # Longer timeout for backend forwarding
    send_batch_size: 1024   # Balanced batching for backend
    send_batch_max_size: 2048

  # Resource processor to add service metadata
  resource:
    attributes:
      - key: service.name
        value: "local-otel-collector"
        action: upsert
      - key: deployment.environment
        value: "local-testing"
        action: upsert

exporters:
  # High-performance Prometheus exporter for real-time metrics
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: "localtesting"
    resource_to_telemetry_conversion:
      enabled: true
    metric_expiration: 5m     # Fast expiration for high-volume scenarios
    enable_open_metrics: true

  # Prometheus remote write for metrics persistence
  prometheusremotewrite/prometheus:
    endpoint: http://prometheus:9090/api/v1/write
    tls:
      insecure: true
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s

  # Loki exporter for structured logs (async forwarding)
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
    timeout: 10s
    labels:
      attributes:
        service.name: "service_name"
        level: "level"
      resource:
        deployment.environment: "environment"
    format: json
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s

  # File exporter for local buffering and debugging
  file/buffer:
    path: /tmp/otel-buffer.jsonl
    rotation:
      max_megabytes: 100
      max_days: 1
      max_backups: 3

  # Debug exporter for troubleshooting (minimal verbosity in production)
  debug:
    verbosity: basic

service:
  # High-performance telemetry pipelines
  pipelines:
    # PRIMARY METRICS PIPELINE: High-performance local processing → Backend forwarding
    metrics/high_performance:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch/high_performance]
      exporters: [prometheus, file/buffer]  # Local endpoints only for speed

    # BACKEND METRICS PIPELINE: Async forwarding to observability stack
    metrics/backend:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch/backend]
      exporters: [prometheusremotewrite/prometheus]  # Backend forwarding

    # LOGS PIPELINE: Buffered log processing
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch/backend]
      exporters: [loki, file/buffer]

    # TRACES PIPELINE: Minimal trace processing for debugging
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch/high_performance]
      exporters: [debug, file/buffer]

  # Collector self-telemetry (minimal to avoid overhead)
  telemetry:
    logs:
      level: "warn"  # Reduced from debug to minimize overhead
    metrics:
      address: 0.0.0.0:8888
      level: normal  # Reduced from detailed

  # Extensions for health monitoring
  extensions: []