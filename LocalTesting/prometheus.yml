# Prometheus configuration for FlinkDotnet
# Scrapes metrics from Flink, Kafka, and Prometheus itself

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'flinkdotnet-monitor'
    environment: 'development'

scrape_configs:
  # Flink JobManager metrics (Prometheus reporter on port 9250)
  - job_name: 'flink-jobmanager'
    metrics_path: '/'
    static_configs:
      - targets: ['flink-jobmanager:9250']
        labels:
          component: 'flink'
          role: 'jobmanager'

  # Flink TaskManager metrics (Prometheus reporter on port 9251)
  - job_name: 'flink-taskmanager'
    metrics_path: '/'
    static_configs:
      - targets: ['flink-taskmanager:9251']
        labels:
          component: 'flink'
          role: 'taskmanager'

  # Kafka JMX metrics via JMX Exporter (port 5556)
  - job_name: 'kafka'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['kafka-exporter:5556']
        labels:
          component: 'kafka'
          role: 'broker'

  # FlinkDotNet JobGateway metrics (Prometheus exporter on host)
  # Gateway runs as .NET executable on host, not in Docker
  # Use host.docker.internal to reach host machine from container
  - job_name: 'flinkdotnet-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          component: 'flinkdotnet'
          role: 'gateway'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'prometheus'
          role: 'server'