# Prometheus configuration for FlinkDotNet (Aspire-compatible)
# Scrapes metrics from Flink, Kafka, Gateway, and Prometheus itself

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'flinkdotnet-monitor'
    environment: 'development'

scrape_configs:
  # Flink JobManager metrics (Prometheus reporter on port 9250)
  - job_name: 'flink-jobmanager'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['flink-jobmanager:9250']
        labels:
          component: 'flink'
          role: 'jobmanager'

  # Flink TaskManager metrics (Prometheus reporter on port 9251 or 9250 depending on your config)
  - job_name: 'flink-taskmanager'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['flink-taskmanager:9251']
        labels:
          component: 'flink'
          role: 'taskmanager'

  # Kafka JMX metrics via JMX Exporter (adjust port to your exporter’s listen port)
  - job_name: 'kafka'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['kafka:7071']
        labels:
          component: 'kafka'
          role: 'broker'

  # FlinkDotNet JobGateway metrics (Gateway runs on host, port is dynamic)
  # Entry-point script should replace __GATEWAY_TARGET__ with host:port
  - job_name: 'flinkdotnet-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['__GATEWAY_TARGET__']
        labels:
          component: 'flinkdotnet'
          role: 'gateway'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          component: 'prometheus'
          role: 'server'